<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جنود الخفاء — التسبيح والأذكار</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d0d0d;
    color: #f5f5f5;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    min-height: 100vh;
    padding: 16px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  header { text-align: center; padding: 14px 0 6px; }
  .shield { font-size: 2.4rem; }
  h1 { color: #d4af37; font-size: 1.5rem; margin: 4px 0 2px; }
  .sub { color: #aaa; font-size: 0.9rem; margin-bottom: 14px; }

  /* التبويبات الرئيسية */
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab {
    flex: 1; padding: 12px 4px; text-align: center; cursor: pointer;
    background: #1c1c1c; border: 1px solid #333; border-radius: 12px;
    color: #ddd; font-size: 1rem; font-weight: bold;
  }
  .tab.active { background: #d4af37; color: #111; border-color: #d4af37; }
  .view { display: none; }
  .view.active { display: block; }

  /* التسبيح */
  .targets { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .target {
    padding: 10px 12px; border-radius: 20px; cursor: pointer;
    background: #1c1c1c; border: 1px solid #444; color: #eee; font-size: 0.95rem;
  }
  .target.active { background: #d4af37; color: #111; border-color: #d4af37; font-weight: bold; }
  .tapBtn {
    width: 230px; height: 230px; margin: 6px auto 14px; display: flex;
    flex-direction: column; align-items: center; justify-content: center;
    border-radius: 50%; cursor: pointer; user-select: none; -webkit-user-select: none;
    background: radial-gradient(circle at 35% 30%, #f5d76e, #d4af37 55%, #9a7b1e);
    color: #111; border: 5px solid #f5d76e;
    box-shadow: 0 0 30px rgba(212,175,55,.35);
    transition: transform .08s ease;
  }
  .tapBtn:active { transform: scale(.95); }
  .tapBtn .word { font-size: 1.25rem; font-weight: bold; padding: 0 16px; text-align: center; line-height: 1.5; }
  .tapBtn .count { font-size: 3rem; font-weight: bold; line-height: 1.1; }
  .tapBtn.done { background: radial-gradient(circle at 35% 30%, #7ee2a0, #2e9e5b 60%, #1d6b3c); border-color: #7ee2a0; color: #fff; }
  .progress { height: 12px; background: #222; border-radius: 6px; overflow: hidden; margin-bottom: 8px; }
  .progress > div { height: 100%; background: #d4af37; width: 0%; transition: width .15s; }
  .progText { text-align: center; color: #ccc; font-size: 1rem; margin-bottom: 14px; }
  .row { display: flex; gap: 10px; }
  .btn {
    flex: 1; padding: 12px; border: none; border-radius: 12px; cursor: pointer;
    font-size: 1rem; font-weight: bold;
  }
  .btn-gold { background: #d4af37; color: #111; }
  .btn-dark { background: #262626; color: #eee; border: 1px solid #444; }
  .total {
    text-align: center; margin-top: 16px; color: #d4af37; font-size: 1.05rem;
    background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 12px;
  }

  /* الأذكار */
  .azkar-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .azkar-head h2 { color: #d4af37; font-size: 1.2rem; }
  .zikr {
    background: #1a1a1a; border: 1px solid #333; border-radius: 14px;
    padding: 14px; margin-bottom: 12px; cursor: pointer; position: relative;
    transition: border-color .15s;
  }
  .zikr:active { transform: scale(.99); }
  .zikr .text { font-size: 1.12rem; line-height: 2; color: #f0f0f0; }
  .zikr .meta { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
  .zikr .badge {
    background: #d4af37; color: #111; font-weight: bold; border-radius: 20px;
    padding: 4px 14px; font-size: 0.95rem; min-width: 70px; text-align: center;
  }
  .zikr .hint { color: #888; font-size: 0.85rem; }
  .zikr.done { border-color: #2e9e5b; background: #12291a; }
  .zikr.done .text { color: #9ed6b0; }
  .zikr.done .badge { background: #2e9e5b; color: #fff; }
  .foot { text-align: center; color: #666; font-size: 0.85rem; margin: 22px 0 8px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="shield">🛡️</div>
    <h1>جنود الخفاء</h1>
    <div class="sub">التسبيح وأذكار الصباح والمساء</div>
  </header>

  <div class="tabs">
    <div class="tab active" data-view="tasbih">📿 التسبيح</div>
    <div class="tab" data-view="morning">🌅 أذكار الصباح</div>
    <div class="tab" data-view="evening">🌙 أذكار المساء</div>
  </div>

  <!-- التسبيح -->
  <div class="view active" id="view-tasbih">
    <div class="targets" id="targets"></div>
    <div class="tapBtn" id="tapBtn">
      <div class="word" id="tapWord">سبحان الله</div>
      <div class="count" id="tapCount">0</div>
    </div>
    <div class="progress"><div id="progBar"></div></div>
    <div class="progText" id="progText">0 / 33</div>
    <div class="row">
      <button class="btn btn-dark" id="resetTasbih">🔄 تصفير العدّاد</button>
      <button class="btn btn-gold" id="nextTarget">التالي ⏭</button>
    </div>
    <div class="total">📿 مجموع التسبيحات: <b id="totalCount">0</b></div>
    <div class="total" style="margin-top:10px">⏰ تذكير بالتسبيح كل ساعة — وكل ساعة ذكر مختلف
      <button class="btn btn-dark" id="reminderToggle" style="flex:none;padding:8px 14px;margin-inline-start:8px">جارٍ التحميل…</button>
    </div>
    <div class="total" style="margin-top:8px">
      <button class="btn btn-gold" id="reminderTest" style="flex:none;padding:8px 14px">🧪 تجربة: إشعار بعد دقيقة — اقفل التطبيق واستناه</button>
    </div>
  </div>

  <!-- أذكار الصباح -->
  <div class="view" id="view-morning">
    <div class="azkar-head">
      <h2>🌅 أذكار الصباح</h2>
      <button class="btn btn-dark" style="flex:none;padding:8px 14px" onclick="resetAzkar('morning'); notifyMorningAzkar();">🔄 إعادة الكل</button>
    </div>
    <div id="list-morning"></div>
  </div>

  <!-- أذكار المساء -->
  <div class="view" id="view-evening">
    <div class="azkar-head">
      <h2>🌙 أذكار المساء</h2>
      <button class="btn btn-dark" style="flex:none;padding:8px 14px" onclick="resetAzkar('evening')">🔄 إعادة الكل</button>
    </div>
    <div id="list-evening"></div>
  </div>

  <div class="foot">جنود الخفاء • حب الخير للغير</div>
</div>

<script>
/* ============ التسبيح ============ */
const TARGETS = [
  { label: "سبحان الله", n: 33 },
  { label: "الحمد لله", n: 33 },
  { label: "الله أكبر", n: 33 },
  { label: "لا إله إلا الله وحده لا شريك له", n: 100 },
  { label: "سبحان الله وبحمده", n: 100 }
];
let targetIdx = 0;
let count = 0;
let total = parseInt(localStorage.getItem("jnoud_tasbih_total") || "0", 10);

const targetsEl = document.getElementById("targets");
const tapBtn = document.getElementById("tapBtn");
const tapWord = document.getElementById("tapWord");
const tapCount = document.getElementById("tapCount");
const progBar = document.getElementById("progBar");
const progText = document.getElementById("progText");
const totalEl = document.getElementById("totalCount");

function renderTargets() {
  targetsEl.innerHTML = "";
  TARGETS.forEach((t, i) => {
    const b = document.createElement("button");
    b.className = "target" + (i === targetIdx ? " active" : "");
    b.textContent = t.label + " (" + t.n + ")";
    b.onclick = () => { targetIdx = i; count = 0; renderTasbih(); };
    targetsEl.appendChild(b);
  });
}
function renderTasbih() {
  const t = TARGETS[targetIdx];
  tapWord.textContent = t.label;
  tapCount.textContent = count;
  progText.textContent = count + " / " + t.n;
  progBar.style.width = Math.min(100, (count / t.n) * 100) + "%";
  tapBtn.classList.toggle("done", count >= t.n);
  tapCount.textContent = count >= t.n ? "✔ تم" : count;
  totalEl.textContent = total;
  renderTargets();
}
tapBtn.addEventListener("click", () => {
  const t = TARGETS[targetIdx];
  if (count >= t.n) return;
  count++;
  total++;
  localStorage.setItem("jnoud_tasbih_total", String(total));
  if (navigator.vibrate) navigator.vibrate(20);
  renderTasbih();
});
document.getElementById("resetTasbih").addEventListener("click", () => { count = 0; renderTasbih(); });
document.getElementById("nextTarget").addEventListener("click", () => {
  targetIdx = (targetIdx + 1) % TARGETS.length;
  count = 0;
  renderTasbih();
});

/* ============ الأذكار ============ */
const KURSI = "اللَّهُ لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ، لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ، لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ، مَنْ ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلَّا بِإِذْنِهِ، يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ، وَلَا يُحِيطُونَ بِشَيْءٍ مِنْ عِلْمِهِ إِلَّا بِمَا شَاءَ، وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ، وَلَا يَئُودُهُ حِفْظُهُمَا، وَهُوَ الْعَلِيُّ الْعَظِيمُ";
const IKHLAS = "بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ، قُلْ هُوَ اللَّهُ أَحَدٌ، اللَّهُ الصَّمَدُ، لَمْ يَلِدْ وَلَمْ يُولَدْ، وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ";
const FALAQ = "بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ، قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ، مِنْ شَرِّ مَا خَلَقَ، وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ، وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ، وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ";
const NAS = "بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ، قُلْ أَعُوذُ بِرَبِّ النَّاسِ، مَلِكِ النَّاسِ، إِلَهِ النَّاسِ، مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ، الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ، مِنَ الْجِنَّةِ وَالنَّاسِ";

const COMMON = [
  { t: KURSI, n: 1, name: "آية الكرسي" },
  { t: IKHLAS, n: 3, name: "سورة الإخلاص" },
  { t: FALAQ, n: 3, name: "سورة الفلق" },
  { t: NAS, n: 3, name: "سورة الناس" }
];

const AZKAR = {
  morning: COMMON.concat([
    { t: "أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذَا الْيَوْمِ وَخَيْرَ مَا بَعْدَهُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذَا الْيَوْمِ وَشَرِّ مَا بَعْدَهُ، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ", n: 1 },
    { t: "اللَّهُمَّ بِكَ أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ النُّشُورُ", n: 1 },
    { t: "اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ لَكَ بِذَنْبِي، فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ", n: 1, name: "سيد الاستغفار" },
    { t: "اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لَا إِلَهَ إِلَّا أَنْتَ، اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْكُفْرِ وَالْفَقْرِ، اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ، لَا إِلَهَ إِلَّا أَنْتَ", n: 3 },
    { t: "حَسْبِيَ اللَّهُ لَا إِلَهَ إِلَّا هُوَ، عَلَيْهِ تَوَكَّلْتُ، وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ", n: 7 },
    { t: "اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ، اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي دِينِي وَدُنْيَايَ وَأَهْلِي وَمَالِي، اللَّهُمَّ اسْتُرْ عَوْرَاتِي وَآمِنْ رَوْعَاتِي، اللَّهُمَّ احْفَظْنِي مِنْ بَيْنِ يَدَيَّ وَمِنْ خَلْفِي وَعَنْ يَمِينِي وَعَنْ شِمَالِي وَمِنْ فَوْقِي، وَأَعُوذُ بِعَظَمَتِكَ أَنْ أُغْتَالَ مِنْ تَحْتِي", n: 1 },
    { t: "اللَّهُمَّ عَالِمَ الْغَيْبِ وَالشَّهَادَةِ، فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ، رَبَّ كُلِّ شَيْءٍ وَمَلِيكَهُ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ، أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي وَمِنْ شَرِّ الشَّيْطَانِ وَشِرْكِهِ، وَأَنْ أَقْتَرِفَ عَلَى نَفْسِي سُوءًا أَوْ أَجُرَّهُ إِلَى مُسْلِمٍ", n: 1 },
    { t: "بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ", n: 3 },
    { t: "رَضِيتُ بِاللَّهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ نَبِيًّا", n: 3 },
    { t: "يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ، أَصْلِحْ لِي شَأْنِي كُلَّهُ، وَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ", n: 1 },
    { t: "أَصْبَحْنَا عَلَى فِطْرَةِ الْإِسْلَامِ، وَعَلَى كَلِمَةِ الْإِخْلَاصِ، وَعَلَى دِينِ نَبِيِّنَا مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ، وَعَلَى مِلَّةِ أَبِينَا إِبْرَاهِيمَ حَنِيفًا مُسْلِمًا وَمَا كَانَ مِنَ الْمُشْرِكِينَ", n: 1 },
    { t: "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ عَدَدَ خَلْقِهِ وَرِضَا نَفْسِهِ وَزِنَةَ عَرْشِهِ وَمِدَادَ كَلِمَاتِهِ", n: 3 },
    { t: "اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا وَرِزْقًا طَيِّبًا وَعَمَلًا مُتَقَبَّلًا", n: 1 },
    { t: "لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ", n: 10 },
    { t: "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ", n: 100 },
    { t: "أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ", n: 100 }
  ]),
  evening: COMMON.concat([

const remaining = { morning: [], evening: [] };

function renderAzkar(which) {
  const list = document.getElementById("list-" + which);
  list.innerHTML = "";
  AZKAR[which].forEach((z, i) => {
    const left = remaining[which][i];
    const card = document.createElement("div");
    card.className = "zikr" + (left === 0 ? " done" : "");
    card.innerHTML =
      '<div class="text">' + z.t + "</div>" +
      '<div class="meta"><span class="hint">' + (z.name ? z.name + " • " : "") + "دوس على الذكر للعدّ</span>" +
      '<span class="badge">' + (left === 0 ? "✔ تم" : "باقي " + left) + "</span></div>";
    card.addEventListener("click", () => {
      if (remaining[which][i] > 0) {
        remaining[which][i]--;
        if (navigator.vibrate) navigator.vibrate(15);
        renderAzkar(which);
      }
    });
    list.appendChild(card);
  });
}
function resetAzkar(which) {
  remaining[which] = AZKAR[which].map(z => z.n);
  renderAzkar(which);
}

/* تنبيه مرئي على الموبايل عند بدء أذكار الصباح (داخل التطبيق فقط) */
function notifyMorningAzkar() {
  try {
    if (window.JnoudAzkar && JnoudAzkar.azkarStarted) JnoudAzkar.azkarStarted("morning");
  } catch (e) {}
}

/* التبويبات */
document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    const wasActive = tab.classList.contains("active");
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
    document.getElementById("view-" + tab.dataset.view).classList.add("active");
    if (tab.dataset.view === "morning" && !wasActive) notifyMorningAzkar();
  });
});

/* تذكير التسبيح كل ساعة (داخل التطبيق فقط) */
const reminderToggle = document.getElementById("reminderToggle");
function renderReminderToggle() {
  let on = true;
  try {
    if (window.JnoudAzkar && JnoudAzkar.tasbihReminderOn) on = !!JnoudAzkar.tasbihReminderOn();
  } catch (e) {}
  reminderToggle.textContent = on ? "🔔 شغّال — دوس للإيقاف" : "🔕 مقفول — دوس للتشغيل";
  reminderToggle.dataset.on = on ? "1" : "0";
}
if (reminderToggle) {
  reminderToggle.addEventListener("click", () => {
    const on = reminderToggle.dataset.on !== "1";
    try {
      if (window.JnoudAzkar && JnoudAzkar.setTasbihReminder) JnoudAzkar.setTasbihReminder(on);
    } catch (e) {}
    reminderToggle.dataset.on = on ? "1" : "0";
    renderReminderToggle();
  });
  renderReminderToggle();
}
const reminderTest = document.getElementById("reminderTest");
if (reminderTest) {
  reminderTest.addEventListener("click", () => {
    try {
      if (window.JnoudAzkar && JnoudAzkar.testTasbihReminder) JnoudAzkar.testTasbihReminder();
    } catch (e) {}
  });
}

/* تشغيل */
resetAzkar("morning");
resetAzkar("evening");
renderTasbih();
