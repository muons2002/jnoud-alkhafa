<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:linear-gradient(160deg,#081426,#0D2B45 55%,#0A3A56);color:#fff;min-height:100vh;padding:22px 14px 40px}
.wrap{max-width:640px;margin:0 auto}
.head{text-align:center;padding:26px 16px 20px;border:1.5px solid rgba(233,199,103,.55);border-radius:20px;background:rgba(8,20,38,.55);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.tile{width:92px;height:92px;margin:0 auto 14px;border-radius:24px;background:linear-gradient(145deg,#2FB9D8,#1565A8);display:flex;align-items:center;justify-content:center;font-size:50px;box-shadow:0 10px 24px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.35)}
.kick{color:#F5C451;font-weight:700;font-size:15px;margin-bottom:6px}
h1{font-size:30px;font-weight:800;color:#E9C767;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.sub{margin-top:8px;color:#CFE6F5;font-size:16px}
.card{margin-top:18px;border:1.5px solid rgba(233,199,103,.45);border-radius:20px;background:rgba(8,20,38,.65);padding:22px 20px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.body{font-size:17px;line-height:2;white-space:pre-wrap;word-break:break-word}
.body a{color:#E9C767;font-weight:700}
.foot{margin-top:18px;text-align:center;color:#9FB8CC;font-size:14px}
.msg{text-align:center;color:#CFE6F5;font-size:17px;padding:30px 10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="tile">🔗</div>
    <div class="kick">جنود الخفاء</div>
    <h1>مجمع لينكات جنود الخفاء</h1>
    <div class="sub">كل مشاريع جنود الخفاء في مكان واحد — بابك لكل حاجة</div>
  </div>
  <div class="card"><div class="body" id="body"><div class="msg">جاري التحميل…</div></div></div>
  <div class="foot">جنود الخفاء — حب الخير للغير</div>
</div>
<script>
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function linkify(s){return esc(s).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');}
fetch('https://jnoud-notes.m-uons2002.workers.dev/get?id=mwv0r0dt1a2j')
  .then(function(r){return r.json();})
  .then(function(d){
    var el=document.getElementById('body');
    if(d && d.item && d.item.body){ el.innerHTML=linkify(d.item.body); }
    else { el.innerHTML='<div class="msg">المجمع مش متاح دلوقتي، جرّب تاني بعد شوية.</div>'; }
  })
  .catch(function(){ document.getElementById('body').innerHTML='<div class="msg">المجمع مش متاح دلوقتي، جرّب تاني بعد شوية.</div>'; });
</script>
