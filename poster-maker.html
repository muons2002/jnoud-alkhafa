<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<link rel="icon" href="data:," />
<title>صانع بوسترات بالاسم — جنود الخفاء</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<style>
  :root{
    color-scheme: dark;
    --bg:#081426; --panel:#0D2B45; --panel2:#123656;
    --gold:#2FB9D8; --gold2:#7fd4ea; --gold-dim:#1B7F9E;
    --ink:#eef4fb; --muted:#9db4cc; --faint:#7188a3;
    --line:#14334d; --line2:#1d4e66;
    --radius:14px;
  }
  *{box-sizing:border-box}
  body{
    margin:0; color:var(--ink);
    font-family:'Segoe UI',Tahoma,Arial,sans-serif;
    background:
      radial-gradient(1100px 480px at 85% -120px, rgba(47,185,216,.05), transparent 60%),
      linear-gradient(160deg,#081426 0%,#0D2B45 55%,#0A3A56 100%);
    background-attachment:fixed;
    min-height:100vh;
  }
  button{font-family:inherit; cursor:pointer}
  .wrap{max-width:680px; margin:0 auto; padding:1rem 1rem 2rem}
  header.brand{display:flex; align-items:center; gap:.8rem; margin:.4rem 0 1rem}
  .brand .tile{
    width:64px; height:64px; border-radius:18px; font-size:34px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(150deg,#FFC65C,#F08A2E 60%,#E86F1E);
    box-shadow:0 12px 26px rgba(240,138,46,.3);
  }
  .brand h1{font-family:'Segoe UI',Tahoma,Arial,sans-serif; font-size:1.5rem; font-weight:700; margin:0; color:var(--gold2); line-height:1.25}
  .brand p{margin:.15rem 0 0; color:var(--muted); font-size:.9rem}
  .lbl{font-weight:800; color:var(--gold2); margin:1.1rem 0 .5rem; font-size:1rem}
  input[type="text"]{
    width:100%; background:var(--panel); border:2px solid var(--line2);
    border-radius:12px; color:var(--ink); padding:.7rem .9rem;
    font-family:inherit; font-size:1.1rem; font-weight:700;
  }
  input[type="text"]:focus{outline:none; border-color:var(--gold)}
  .hint{color:var(--faint); font-size:.85rem; margin-top:.4rem; line-height:1.7}
  .chips{display:flex; gap:.45rem; flex-wrap:wrap}
  .chips button{
    background:var(--panel); color:var(--muted); border:1px solid var(--line);
    border-radius:999px; padding:.45rem .9rem; font-size:.95rem; font-weight:700; min-height:2.4rem;
  }
  .chips button.on{background:linear-gradient(160deg,#2794B6,#1E8FAD 55%,#156A87); color:#06222e; border-color:var(--gold)}
  .styles{display:flex; gap:.6rem}
  .styles button{
    flex:1; background:var(--panel); color:var(--muted); border:2px solid var(--line);
    border-radius:12px; padding:.6rem .3rem; font-size:.92rem; font-weight:800; min-height:3.4rem;
  }
  .styles button .em{display:block; font-size:1.5rem; margin-bottom:.2rem}
  .styles button.on{border-color:var(--gold); color:var(--ink); background:var(--panel2)}
  .stage{
    margin-top:1.2rem; border:1px solid var(--line2); border-radius:18px; overflow:hidden;
    background:#081426; box-shadow:0 18px 40px rgba(0,0,0,.35);
  }
  canvas{display:block; width:100%; height:auto}
  .btns{display:flex; gap:.6rem; margin-top:1rem}
  .btns button{
    flex:1; border-radius:12px; padding:.8rem .5rem; font-size:1.05rem; font-weight:800; min-height:3.2rem;
  }
  .btns .main{background:linear-gradient(160deg,#2794B6,#1E8FAD 55%,#156A87); color:#06222e; border:0}
  .btns .ghost{background:transparent; color:var(--muted); border:1px solid var(--line2)}
  footer.site{color:var(--faint); font-size:.85rem; text-align:center; margin-top:1.4rem; line-height:1.9}
  footer.site b{color:var(--gold)}
</style>
</head>
<body>
<div class="wrap">
  <header class="brand">
    <div class="tile">🎨</div>
    <div>
      <h1>صانع بوسترات بالاسم</h1>
      <p>اعمل بوسترك باسمك وشاركه مع حبايبك</p>
    </div>
  </header>

  <div class="lbl">✍️ الاسم اللي هيظهر على البوستر</div>
  <input type="text" id="nameInput" maxlength="30" placeholder="اكتب الاسم هنا…" autocomplete="off" />
  <div class="hint">اكتب اسمك… أو اسم أي حد عاوز تهديه البوستر أو توجّه له الشكر — الاسم بيتكتب زي ما تكتبه بالظبط.</div>

  <div class="lbl">🎉 المناسبة</div>
  <div class="chips" id="occChips">
    <button type="button" data-occ="morning" class="on">☀️ صباح الخير</button>
    <button type="button" data-occ="friday">🕌 جمعة مباركة</button>
    <button type="button" data-occ="evening">🌙 مساء الخير</button>
    <button type="button" data-occ="thanks">❤️ شكراً لك</button>
    <button type="button" data-occ="congrats">🎉 ألف مبروك</button>
  </div>

  <div class="lbl">🎨 شكل التصميم</div>
  <div class="styles" id="styleBtns">
    <button type="button" data-style="a" class="on"><span class="em">🖼️</span>البلاطة</button>
    <button type="button" data-style="b"><span class="em">🌅</span>المشهد</button>
    <button type="button" data-style="c"><span class="em">🏷️</span>الإطار</button>
  </div>

  <div class="stage"><canvas id="poster" width="1080" height="1080"></canvas></div>

  <div class="btns">
    <button type="button" class="main" id="dlBtn">⬇️ حمّل صورتك</button>
    <button type="button" class="ghost" id="shareBtn">📤 مشاركة</button>
  </div>

  <footer class="site"><b>جنود الخفاء 🛡️</b> حب الخير للغير</footer>
</div>

<script>
const OCC = {
  morning:  { g:'صباح الخير',  e:'☀️', dua:'يومك سعيد ومليان خير وبركة',        c1:'#FFC65C', c2:'#E86F1E' },
  friday:   { g:'جمعة مباركة', e:'🕌', dua:'تقبل الله منا ومنكم صالح الأعمال',   c1:'#2FB9D8', c2:'#3FB27F' },
  evening:  { g:'مساء الخير',  e:'🌙', dua:'مساك سعيد وقلبك مطمئن',             c1:'#5B8DEF', c2:'#7B5CFF' },
  thanks:   { g:'شكراً لك',    e:'❤️', dua:'جزاك الله خيراً وبارك الله فيك',     c1:'#FF7A9E', c2:'#E84A6F' },
  congrats: { g:'ألف مبروك',   e:'🎉', dua:'ربنا يتمم لك على خير ويسعد قلبك',    c1:'#B78CFF', c2:'#2FB9D8' }
};
const state = { name:'', occ:'morning', style:'a' };
const cv = document.getElementById('poster');
const ctx = cv.getContext('2d');
const EMOJI_FONT = '"Segoe UI Emoji","Noto Color Emoji","Apple Color Emoji",sans-serif';

function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function bg(){
  const gr = ctx.createLinearGradient(0,0,1080,1080);
  gr.addColorStop(0,'#081426'); gr.addColorStop(.55,'#0D2B45'); gr.addColorStop(1,'#0A3A56');
  ctx.fillStyle = gr; ctx.fillRect(0,0,1080,1080);
}
function glow(x,y,r,color){
  const gr = ctx.createRadialGradient(x,y,0,x,y,r);
  gr.addColorStop(0,color); gr.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = gr; ctx.fillRect(x-r,y-r,r*2,r*2);
}
function tile(x,y,s,c1,c2,e,emojiSize){
  const gr = ctx.createLinearGradient(x,y,x+s,y+s);
  gr.addColorStop(0,c1); gr.addColorStop(1,c2);
  rr(x,y,s,s,s*.24); ctx.fillStyle = gr; ctx.fill();
  ctx.font = emojiSize + 'px ' + EMOJI_FONT;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(e, x+s/2, y+s/2 + emojiSize*.04);
}
function text(str,x,y,font,color){
  ctx.font = font; ctx.fillStyle = color;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(str,x,y);
}
function brand(y,size){
  text('جنود الخفاء 🛡️ حب الخير للغير', 540, y, '800 ' + size + 'px 'Segoe UI',Tahoma,Arial,sans-serif', '#2FB9D8');
}
function draw(){
  const o = OCC[state.occ];
  const name = (state.name || '').trim() || 'صديقي';
  const nameLine = 'يا ' + name;
  bg();
  if (state.style === 'a'){
    glow(140,80,420,'rgba(47,185,216,.20)');
    glow(980,1020,420,'rgba(47,185,216,.12)');
    tile(390,130,300,o.c1,o.c2,o.e,175);
    text(o.g, 540, 600, '800 126px 'Segoe UI',Tahoma,Arial,sans-serif', '#FFFFFF');
    text(nameLine, 540, 712, '700 80px 'Segoe UI',Tahoma,Arial,sans-serif', '#7FD4EA');
    text(o.dua, 540, 812, '600 40px 'Segoe UI',Tahoma,Arial,sans-serif', '#BEE9F5');
    brand(985, 34);
  } else if (state.style === 'b'){
    const gr = ctx.createLinearGradient(0,0,0,480);
    gr.addColorStop(0,o.c2); gr.addColorStop(1,o.c1);
    ctx.fillStyle = gr; ctx.fillRect(0,0,1080,480);
    ctx.beginPath(); ctx.arc(540,242,178,0,Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,.22)'; ctx.fill();
    ctx.font = '205px ' + EMOJI_FONT; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(o.e, 540, 250);
    ctx.fillStyle = '#2FB9D8'; ctx.fillRect(0,478,1080,4);
    text(o.g, 540, 636, '800 112px 'Segoe UI',Tahoma,Arial,sans-serif', '#FFFFFF');
    text(nameLine, 540, 742, '700 76px 'Segoe UI',Tahoma,Arial,sans-serif', '#7FD4EA');
    text(o.dua, 540, 828, '600 38px 'Segoe UI',Tahoma,Arial,sans-serif', '#BEE9F5');
    brand(985, 32);
  } else {
    glow(540,60,460,'rgba(47,185,216,.14)');
    rr(40,40,1000,1000,36); ctx.strokeStyle = 'rgba(47,185,216,.85)'; ctx.lineWidth = 3; ctx.stroke();
    tile(455,118,170,o.c1,o.c2,o.e,100);
    text(o.g, 540, 452, '800 118px 'Segoe UI',Tahoma,Arial,sans-serif', '#FFFFFF');
    ctx.font = '700 74px 'Segoe UI',Tahoma,Arial,sans-serif';
    const tw = ctx.measureText(nameLine).width;
    rr(540-(tw+96)/2, 540, tw+96, 116, 58);
    ctx.fillStyle = '#123656'; ctx.fill();
    ctx.strokeStyle = '#1D4E66'; ctx.lineWidth = 2; ctx.stroke();
    text(nameLine, 540, 600, '700 74px 'Segoe UI',Tahoma,Arial,sans-serif', '#7FD4EA');
    text(o.dua, 540, 748, '600 38px 'Segoe UI',Tahoma,Arial,sans-serif', '#BEE9F5');
    brand(950, 32);
  }
}
function redraw(){ draw(); }

document.getElementById('nameInput').addEventListener('input', e => { state.name = e.target.value; redraw(); });
document.getElementById('occChips').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  document.querySelectorAll('#occChips button').forEach(x => x.classList.toggle('on', x === b));
  state.occ = b.dataset.occ; redraw();
});
document.getElementById('styleBtns').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  document.querySelectorAll('#styleBtns button').forEach(x => x.classList.toggle('on', x === b));
  state.style = b.dataset.style; redraw();
});
document.getElementById('dlBtn').addEventListener('click', () => {
  cv.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'jnoud-poster.png';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }, 'image/png');
});
document.getElementById('shareBtn').addEventListener('click', () => {
  cv.toBlob(async blob => {
    const file = new File([blob], 'jnoud-poster.png', { type:'image/png' });
    if (navigator.canShare && navigator.canShare({ files:[file] })) {
      try { await navigator.share({ files:[file] }); } catch(_){}
    } else if (navigator.share) {
      try { await navigator.share({ title:'بوستر جنود الخفاء', text:'عملت بوستري في صانع بوسترات جنود الخفاء 🎨' }); } catch(_){}
    } else {
      document.getElementById('dlBtn').click();
    }
  }, 'image/png');
});

if (document.fonts && document.fonts.load) {
  Promise.all([
    document.fonts.load('800 126px "Segoe UI"'), document.fonts.load('700 80px Changa'),
    document.fonts.load('600 40px "Segoe UI"'), document.fonts.load('800 34px Cairo')
  ]).then(redraw).catch(redraw);
  document.fonts.ready.then(redraw);
}
redraw();
</script>
</body>
</html>
