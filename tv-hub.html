<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; }
  body {
    font-family: Tahoma, 'Segoe UI', Arial, sans-serif;
    background:#081426;
    background:-webkit-linear-gradient(160deg, #081426, #0D2B45 55%, #0A3A56);
    background:linear-gradient(160deg, #081426, #0D2B45 55%, #0A3A56);
    color:#FFFFFF;
  }
  #stage {
    position:absolute; left:50%; top:50%;
    width:1920px; height:1080px;
    margin-left:-960px; margin-top:-540px;
    padding:36px 44px;
    transform-origin:center center;
    -webkit-transform-origin:center center;
  }
  /* ---------- header ---------- */
  #header { height:128px; position:relative; }
  #emblem { width:108px; height:108px; border-radius:24px; float:right; }
  #titleBox { float:right; margin-right:26px; padding-top:8px; }
  #title { font-size:56px; font-weight:bold; line-height:1.15; }
  #subtitle { font-size:25px; color:#9FC6D8; margin-top:4px; }
  #clockBox { float:left; }
  #avatar { width:92px; height:92px; border-radius:50%; border:3px solid #2FB9D8; float:left; }
  #clockCol { float:left; margin-left:18px; text-align:center; padding-top:12px; }
  #clockText { font-size:38px; font-weight:bold; color:#2FB9D8; text-align:center; }
  #dateText { font-size:21px; color:#9FC6D8; text-align:center; margin-top:3px; }
  /* ---------- prayer strip ---------- */
  #prayerStrip {
    margin-top:20px; height:74px; line-height:74px;
    background:rgba(47,185,216,0.12);
    border:2px solid rgba(47,185,216,0.45);
    border-radius:18px; text-align:center;
    font-size:33px; color:#EAF7FC;
  }
  #prayerStrip b { color:#2FB9D8; }
  /* ---------- shared card focus ---------- */
  .card {
    background:rgba(13,43,69,0.88);
    border:3px solid rgba(47,185,216,0.28);
    border-radius:28px;
    position:relative;
    cursor:pointer;
  }
  .card.focused {
    border-color:#2FB9D8;
    box-shadow:0 0 0 3px #2FB9D8, 0 0 42px rgba(47,185,216,0.55);
    transform:scale(1.045);
    -webkit-transform:scale(1.045);
    z-index:3;
  }
  .tile {
    border-radius:30px; text-align:center; color:#FFFFFF;
  }
  /* ---------- home: category cards ---------- */
  #catRow { margin-top:38px; }
  .catCard { float:right; width:438px; height:496px; margin-left:26px; text-align:center; }
  .catCard.last { margin-left:0; }
  .catCard .tile { width:178px; height:178px; margin:42px auto 0 auto; font-size:102px; line-height:178px; }
  .catName { font-size:45px; font-weight:bold; margin-top:28px; padding:0 14px; }
  .catProjects { font-size:22px; color:#9FC6D8; line-height:1.75; margin-top:12px; padding:0 24px; height:118px; overflow:hidden; }
  .catCount {
    position:absolute; bottom:26px; left:50%; margin-left:-72px; width:144px;
    font-size:24px; color:#2FB9D8; border:2px solid rgba(47,185,216,0.55);
    border-radius:999px; padding:5px 0; text-align:center;
  }
  #homeHint { margin-top:34px; text-align:center; font-size:24px; color:#7FA8BC; }
  #homeHint span { color:#D4A017; }
  /* ---------- category view ---------- */
  #catBar { margin-top:30px; height:82px; }
  #backBtn {
    float:right; font-size:30px; color:#EAF7FC;
    background:rgba(13,43,69,0.88);
    border:3px solid rgba(47,185,216,0.28);
    border-radius:999px; padding:14px 34px; cursor:pointer;
  }
  #backBtn.focused {
    border-color:#2FB9D8;
    box-shadow:0 0 0 3px #2FB9D8, 0 0 34px rgba(47,185,216,0.55);
  }
  #catTitle { float:right; font-size:44px; font-weight:bold; margin-right:28px; line-height:82px; }
  #catCountLbl { float:right; font-size:26px; color:#9FC6D8; margin-right:18px; line-height:82px; }
  #projGrid { margin-top:26px; }
  .projCard { float:right; width:438px; height:258px; margin-left:26px; margin-bottom:26px; padding:26px; }
  .projCard.last { margin-left:0; }
  .projCard .tile { width:118px; height:118px; font-size:64px; line-height:118px; float:right; }
  .projName { float:right; width:232px; margin-right:14px; font-size:31px; font-weight:bold; line-height:1.45; padding-top:12px; }
  .clear { clear:both; }
</style>

      </div>
    </div>
    <div class="clear"></div>
  </div>

  <div id="prayerStrip"><span id="prayerText">جنود الخفاء — حب الخير للغير</span></div>

  <div id="homeView">
    <div id="catRow"></div>
    <div class="clear"></div>
    <div id="homeHint">استخدم أسهم الريموت للتنقل و OK للاختيار &nbsp;•&nbsp; <span>heylink.me/InvisibleSoldiers</span></div>
  </div>

  <div id="catView" style="display:none;">
    <div id="catBar">
      <div id="backBtn" data-action="back">&#8594; رجوع</div>
      <div id="catTitle"></div>
      <div id="catCountLbl"></div>
      <div class="clear"></div>
    </div>
    <div id="projGrid"></div>
    <div class="clear"></div>
  </div>
</div>

<script>
/* ============================================================
   جنود الخفاء TV — web hub for smart-TV browsers (webOS/Tizen/Android TV)
   Conservative ES5: XHR (no fetch), flex/float layout (no grid),
   no CSS variables, no arrow functions / template literals.
   Data: live manifest (same as the apps) -> localStorage cache -> baked-in.
   ============================================================ */
var MANIFEST_URL = 'https://muons2002.github.io/radio-station/app-projects-v2.json';
var ALADHAN_URL  = 'https://api.aladhan.com/v1/timingsByCity?city=Cairo&country=Egypt&method=5';

var CATS = [
  { id:'religion', name:'الإسلاميات',       emoji:'📖', c1:'#1B5E20', c2:'#43A047' },
  { id:'audio',    name:'الصوتيات والتراث', emoji:'📻', c1:'#B71C1C', c2:'#E53935' },
  { id:'sport',    name:'الرياضة والترفيه', emoji:'⚽', c1:'#00695C', c2:'#26A69A' },
  { id:'tools',    name:'الأدوات',          emoji:'🧰', c1:'#283593', c2:'#5C6BC0' }
];

var SPORTSLIVE = { key:'sportslive', title:'قنوات رياضية مباشر', emoji:'📺', category:'sport',
                   color1:'#E65100', color2:'#FF9100',
                   url:'https://muons2002.github.io/radio-station/sports-live.html' };

/* Baked-in fallback: mirrors the apps' 19-project registry (manifest order,
   sportslive right after radar). Used only if live fetch AND cache both fail. */
var BAKED = [
  { key:'codes',       title:'بوابة جنود الخفاء التقنية',        emoji:'💻', category:'tech',     color1:'#1E3C72', color2:'#2A5298', url:'https://muons2002.github.io/radio-station/jnoud-codes.html' },
  { key:'player',      title:'مشغل جنود الخفاء العام',           emoji:'▶️', category:'tech',     color1:'#8E2DE2', color2:'#4A00E0', url:'https://muons2002.github.io/radio-station/jnoud-player.html' },
  { key:'heritage',    title:'كنوز التراث المصري الأصيل',        emoji:'🏺', category:'audio',    color1:'#8A5A00', color2:'#C9962E', url:'https://muons2002.github.io/radio-station/konouz-elturath.html' },
  { key:'radar',       title:'جدول مباريات جنود الخفاء',         emoji:'📡', category:'sport',    color1:'#00695C', color2:'#26A69A', url:'https://muons2002.github.io/radio-station/matches-radar.html' },
  { key:'sportslive',  title:'قنوات رياضية مباشر',               emoji:'📺', category:'sport',    color1:'#E65100', color2:'#FF9100', url:'https://muons2002.github.io/radio-station/sports-live.html' },
  { key:'checker',     title:'فاحص وفلترة ملفات القنوات',       emoji:'🧪', category:'tech',     color1:'#4527A0', color2:'#7E57C2', url:'https://muons2002.github.io/radio-station/m3u-checker.html' },
  { key:'studio',      title:'استوديو قوائم البث',               emoji:'🎬', category:'tech',     color1:'#AD1457', color2:'#EC407A', url:'https://muons2002.github.io/radio-station/playlist-studio.html' },
  { key:'gold',        title:'أسعار الذهب في مصر',               emoji:'🪙', category:'tech',     color1:'#9C7A00', color2:'#D4A017', url:'https://muons2002.github.io/radio-station/gold-prices.html' },
  { key:'satfinder',   title:'دليل الترددات وموجه الطبق',        emoji:'🛰️', category:'tech',     color1:'#283593', color2:'#5C6BC0', url:'https://muons2002.github.io/radio-station/sat-finder.html' },
  { key:'maintenance', title:'المساعد الهندسي للصيانة والشبكات', emoji:'🛠️', category:'tech',     color1:'#37474F', color2:'#78909C', url:'https://muons2002.github.io/radio-station/maintenance-assistant.html' },
  { key:'satdb',       title:'منصة الستالايت والسوفت وير',       emoji:'💾', category:'tech',     color1:'#4E342E', color2:'#8D6E63', url:'https://muons2002.github.io/radio-station/sat-db.html' },
  { key:'radio',       title:'إذاعة جنود الخفاء',                emoji:'📻', category:'audio',    color1:'#B71C1C', color2:'#E53935', url:'https://muons2002.github.io/radio-station/radio-jnoud.html' },
  { key:'hikayat',     title:'حكايات عبد العزيز العروي',         emoji:'🪔', category:'audio',    color1:'#6A1B9A', color2:'#AB47BC', url:'https://muons2002.github.io/radio-station/hikayat-elaroui.html' },
  { key:'quran',       title:'القرآن الكريم',                    emoji:'📖', category:'religion', color1:'#004D40', color2:'#00897B', url:'https://muons2002.github.io/radio-station/quran.html' },
  { key:'prayer',      title:'مواقيت الصلاة',                    emoji:'🕌', category:'religion', color1:'#1A237E', color2:'#3949AB', url:'https://muons2002.github.io/radio-station/prayer.html' },
  { key:'tasbih',      title:'التسبيح والأذكار',                 emoji:'📿', category:'religion', color1:'#880E4F', color2:'#C2185B', url:'https://muons2002.github.io/radio-station/tasbih.html' },
  { key:'shaarawy',    title:'مكتبة الشيخ الشعراوي',             emoji:'🎙️', category:'religion', color1:'#8D6E00', color2:'#F9A825', url:'https://muons2002.github.io/radio-station/shaarawy.html' },
  { key:'quranradio',  title:'راديو قرآن كريم',                  emoji:'📻', category:'religion', color1:'#1E5631', color2:'#2E7D32', url:'https://muons2002.github.io/radio-station/radio-quran.html' },
  { key:'alf-leila',   title:'ألف ليلة وليلة',                   emoji:'🌙', category:'audio',    color1:'#311B92', color2:'#673AB7', url:'https://muons2002.github.io/radio-station/alf-leila.html' }
];

/* ---------------- state ---------------- */
var projectsByCat = { religion:[], audio:[], sport:[], tools:[] };
var view = 'home';            /* 'home' | 'cat' */
var curCatId = null;
var focusList = [];
var curEl = null;
var homeFocusKey = 'religion';

/* ---------------- tiny helpers ---------------- */
function $(id){ return document.getElementById(id); }
function arDigits(s){
  var d = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
  return ('' + s).replace(/[0-9]/g, function(ch){ return d[ch.charCodeAt(0) - 48]; });
}
function pad2(n){ return (n < 10 ? '0' : '') + n; }
function lsGet(k){ try { return window.localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k, v){ try { window.localStorage.setItem(k, v); } catch(e){} }
function hasClass(el, c){ return (' ' + el.className + ' ').indexOf(' ' + c + ' ') >= 0; }
function addClass(el, c){ if (!hasClass(el, c)) el.className += (el.className ? ' ' : '') + c; }
function removeClass(el, c){
  var parts = el.className.split(' '), out = [], i;
  for (i = 0; i < parts.length; i++) if (parts[i] && parts[i] !== c) out.push(parts[i]);
  el.className = out.join(' ');
}
function xhrGet(url, ok, fail){
  var x = null, done = false;
  try { x = new XMLHttpRequest(); } catch(e){ fail(); return; }
  function once(fn){ if (!done){ done = true; fn(); } }
  try {
    x.open('GET', url, true);
    x.onreadystatechange = function(){
      if (x.readyState === 4){
        if (x.status >= 200 && x.status < 300) once(function(){ ok(x.responseText); });
        else once(fail);
      }
    };
    x.onerror = function(){ once(fail); };
    setTimeout(function(){ once(function(){ try { x.abort(); } catch(e){} fail(); }); }, 9000);
    x.send();
  } catch(e){ once(fail); }
}
function gradStyle(c1, c2){
  return 'background:' + c1 + ';background:-webkit-linear-gradient(135deg,' + c1 + ',' + c2 + ');background:linear-gradient(135deg,' + c1 + ',' + c2 + ');';
}
function countLabel(n){
  if (n === 1) return 'مشروع واحد';
  if (n === 2) return 'مشروعان';
  return arDigits(n) + ' مشاريع';
}

/* ---------------- data ---------------- */
function categoryOf(p){
  if (p.key === 'player') return 'tools';           /* key-based override */
  var c = p.category;
  if (c === 'tech' || c === 'tools') return 'tools';
  if (c === 'religion' || c === 'audio' || c === 'sport') return c;
  return null;                                       /* unknown: skip entry */
}
function normalize(list){
  var out = [], i, hasLive = false;
  if (!list) return out;
  for (i = 0; i < list.length; i++){
    var p = list[i];
    if (!p || !p.key || !p.title || !p.url) continue;
    out.push(p);
    if (p.key === 'sportslive') hasLive = true;
  }
  if (!hasLive){
    var idx = -1;
    for (i = 0; i < out.length; i++) if (out[i].key === 'radar') idx = i;
    if (idx >= 0) out.splice(idx + 1, 0, SPORTSLIVE); else out.push(SPORTSLIVE);
  }
  return out;
}
function applyData(list){
  var norm = normalize(list), i, p, cat;
  projectsByCat = { religion:[], audio:[], sport:[], tools:[] };
  for (i = 0; i < norm.length; i++){
    p = norm[i]; cat = categoryOf(p);
    if (cat) projectsByCat[cat].push(p);
  }
  /* الأدوات: المشغّل العام أولاً كما في التطبيقات */
  var tools = projectsByCat.tools;
  for (i = 0; i < tools.length; i++){
    if (tools[i].key === 'player'){ var pl = tools.splice(i, 1)[0]; tools.unshift(pl); break; }
  }
  renderHome();
  if (view === 'cat' && curCatId) renderCat(curCatId, true);
}
function loadManifest(){
  xhrGet(MANIFEST_URL, function(txt){
    var parsed = null;
    try { parsed = JSON.parse(txt); } catch(e){}
    if (parsed && parsed.length){ lsSet('tvhub_manifest', txt); applyData(parsed); }
    else manifestFallback();
  }, manifestFallback);
}
function manifestFallback(){
  var cached = lsGet('tvhub_manifest'), parsed = null;
  if (cached){ try { parsed = JSON.parse(cached); } catch(e){} }
  if (parsed && parsed.length) applyData(parsed);
  /* else: keep the baked-in render already on screen */
}

/* ---------------- rendering ---------------- */
function renderHome(){
  var row = $('catRow'), i, c, list, names, shown, card, html;
  row.innerHTML = '';
  for (i = 0; i < CATS.length; i++){
    c = CATS[i];
    list = projectsByCat[c.id];
    names = [];
    for (var j = 0; j < list.length; j++) names.push(list[j].title);
    shown = names.join(' • ');
    if (shown.length > 118){
      var acc = '', cut = false;
      for (var k = 0; k < names.length; k++){
        var cand = acc ? acc + ' • ' + names[k] : names[k];
        if (cand.length > 118){ cut = true; break; }
        acc = cand;
      }
      shown = acc + (cut ? ' • …' : '');
    }
    card = document.createElement('div');
    card.className = 'card catCard focusable' + (i === CATS.length - 1 ? ' last' : '');
    card.setAttribute('data-cat', c.id);
    html = '<div class="tile" style="' + gradStyle(c.c1, c.c2) + '">' + c.emoji + '</div>'
         + '<div class="catName">' + c.name + '</div>'
         + '<div class="catProjects">' + shown + '</div>'
         + '<div class="catCount">' + countLabel(list.length) + '</div>';
    card.innerHTML = html;
    attachActivate(card);
    row.appendChild(card);
  }
  if (view === 'home') collectFocus('home');
}
function renderCat(catId, keepFocus){
  var c = null, i, list;
  for (i = 0; i < CATS.length; i++) if (CATS[i].id === catId) c = CATS[i];
  if (!c) return;
  list = projectsByCat[catId];
  $('catTitle').innerHTML = c.emoji + ' ' + c.name;
  $('catCountLbl').innerHTML = countLabel(list.length);
  var grid = $('projGrid');
  grid.innerHTML = '';
  for (i = 0; i < list.length; i++){
    var p = list[i];
    var card = document.createElement('div');
    card.className = 'card projCard focusable' + ((i % 4) === 3 ? ' last' : '');
    card.setAttribute('data-url', p.url);
    card.innerHTML = '<div class="tile" style="' + gradStyle(p.color1 || '#37474F', p.color2 || '#78909C') + '">' + (p.emoji || '🔹') + '</div>'
                   + '<div class="projName">' + p.title + '</div>'
                   + '<div class="clear"></div>';
    attachActivate(card);
    grid.appendChild(card);
  }
  collectFocus('cat');
}
function attachActivate(el){
  el.onclick = function(){ setFocus(el); activate(el); };
}

/* ---------------- views ---------------- */
function showHome(){
  view = 'home';
  $('catView').style.display = 'none';
  $('homeView').style.display = 'block';
  collectFocus('home');
}
function showCat(catId){
  view = 'cat'; curCatId = catId;
  $('homeView').style.display = 'none';
  $('catView').style.display = 'block';
  renderCat(catId, false);
}

/* ---------------- focus / spatial navigation ---------------- */
function collectFocus(which){
  var container = (which === 'home') ? $('catRow') : $('catView');
  focusList = [];
  var els = container.getElementsByTagName('div'), i;
  for (i = 0; i < els.length; i++) if (hasClass(els[i], 'focusable') || els[i].id === 'backBtn') focusList.push(els[i]);
  if (which === 'cat'){
    /* back button first */
    var bb = $('backBtn'), idx = focusList.indexOf(bb);
    if (idx > 0){ focusList.splice(idx, 1); focusList.unshift(bb); }
  }
  var target = null;
  if (which === 'home'){
    for (i = 0; i < focusList.length; i++)
      if (focusList[i].getAttribute('data-cat') === homeFocusKey) target = focusList[i];
  } else {
    for (i = 0; i < focusList.length; i++)
      if (focusList[i].getAttribute('data-url')){ target = focusList[i]; break; }
  }
  setFocus(target || focusList[0] || null);
}
function setFocus(el){
  if (curEl) removeClass(curEl, 'focused');
  curEl = el;
  if (curEl) addClass(curEl, 'focused');
}
function ctr(el){
  var r = el.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
}
function moveFocus(dir){
  if (!curEl || !focusList.length) return;
  var c = ctr(curEl), best = null, bestScore = 1e18, i, el, p, dx, dy, score;
  for (i = 0; i < focusList.length; i++){
    el = focusList[i];
    if (el === curEl) continue;
    p = ctr(el); dx = p.x - c.x; dy = p.y - c.y; score = null;
    if (dir === 'left'  && dx < -6) score = -dx + Math.abs(dy) * 2.6;
    if (dir === 'right' && dx >  6) score =  dx + Math.abs(dy) * 2.6;
    if (dir === 'up'    && dy < -6) score = -dy + Math.abs(dx) * 2.6;
    if (dir === 'down'  && dy >  6) score =  dy + Math.abs(dx) * 2.6;
    if (score !== null && score < bestScore){ bestScore = score; best = el; }
  }
  if (best) setFocus(best);
}
function activate(el){
  if (!el) return;
  if (el.id === 'backBtn'){ showHome(); return; }
  var cat = el.getAttribute('data-cat');
  if (cat){ homeFocusKey = cat; showCat(cat); return; }
  var url = el.getAttribute('data-url');
  if (url) window.location.href = url;
}
function goBack(){
  if (view === 'cat') showHome();
  /* on home: nothing (browser owns exit) */
}
document.addEventListener('keydown', function(e){
  var k = e.keyCode || e.which || 0;
  if (!k && e.key){
    if (e.key === 'ArrowLeft') k = 37; else if (e.key === 'ArrowUp') k = 38;
    else if (e.key === 'ArrowRight') k = 39; else if (e.key === 'ArrowDown') k = 40;
    else if (e.key === 'Enter') k = 13;
    else if (e.key === 'Escape' || e.key === 'BrowserBack' || e.key === 'GoBack') k = 27;
  }
  if (k === 37){ moveFocus('left');  e.preventDefault(); }
  else if (k === 38){ moveFocus('up');    e.preventDefault(); }
  else if (k === 39){ moveFocus('right'); e.preventDefault(); }
  else if (k === 40){ moveFocus('down');  e.preventDefault(); }
  else if (k === 13){ activate(curEl);    e.preventDefault(); }
  else if (k === 27 || k === 8 || k === 461 || k === 10009){ goBack(); e.preventDefault(); }
});
$('backBtn').onclick = function(){ setFocus($('backBtn')); goBack(); };

/* ---------------- stage scaling ---------------- */
function fit(){
  var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  var st = $('stage');
  st.style.transform = 'scale(' + s + ')';
  st.style.webkitTransform = 'scale(' + s + ')';
}
window.addEventListener('resize', fit);

/* ---------------- clock ---------------- */
var DAY_NAMES = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
function fmtClock(d){
  var h = d.getHours(), suf = h < 12 ? 'ص' : 'م', h12 = h % 12;
  if (h12 === 0) h12 = 12;
  return arDigits(h12 + ':' + pad2(d.getMinutes())) + ' ' + suf;
}
function tickClock(){
  var d = new Date();
  $('clockText').innerHTML = fmtClock(d);
  $('dateText').innerHTML = DAY_NAMES[d.getDay()] + ' ' + arDigits(d.getDate() + '/' + (d.getMonth() + 1) + '/' + d.getFullYear());
}

/* ---------------- next prayer (Aladhan, Cairo) ---------------- */
var PKEYS  = ['Fajr', 'Sunrise', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];
var PNAMES = ['الفجر', 'الشروق', 'الظهر', 'العصر', 'المغرب', 'العشاء'];
var prayerTimings = null;   /* {Fajr:'04:51', ...} */
function todayKey(){
  var d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}
function cleanTime(v){
  if (!v) return null;
  var m = ('' + v).match(/([0-9]{1,2}):([0-9]{2})/);
  if (!m) return null;
  return pad2(parseInt(m[1], 10)) + ':' + m[2];
}
function toMin(t){ var p = t.split(':'); return parseInt(p[0], 10) * 60 + parseInt(p[1], 10); }
function fmtPrayerTime(t){
  var p = t.split(':'), h = parseInt(p[0], 10), suf = h < 12 ? 'ص' : 'م', h12 = h % 12;
  if (h12 === 0) h12 = 12;
  return arDigits(h12 + ':' + p[1]) + ' ' + suf;
}
function updatePrayerStrip(){
  if (!prayerTimings) return;
  var now = new Date(), cur = now.getHours() * 60 + now.getMinutes(), i, mins, found = null;
  for (i = 0; i < PKEYS.length; i++){
    mins = toMin(prayerTimings[PKEYS[i]]);
    if (mins > cur){ found = { name: PNAMES[i], time: prayerTimings[PKEYS[i]], rem: mins - cur }; break; }
  }
  if (!found){
    mins = toMin(prayerTimings.Fajr) + 1440;
    found = { name: PNAMES[0], time: prayerTimings.Fajr, rem: mins - cur };
  }
  var remStr = pad2(Math.floor(found.rem / 60)) + ':' + pad2(found.rem % 60);
  $('prayerText').innerHTML = '🕌 الصلاة القادمة: <b>' + found.name + '</b> — ' + fmtPrayerTime(found.time) + ' &nbsp;•&nbsp; المتبقي ' + arDigits(remStr);
}
function loadPrayer(){
  var cached = lsGet('tvhub_prayer'), obj = null;
  if (cached){ try { obj = JSON.parse(cached); } catch(e){} }
  if (obj && obj.date === todayKey() && obj.timings){
    prayerTimings = obj.timings;
    updatePrayerStrip();
    return;
  }
  xhrGet(ALADHAN_URL, function(txt){
    var data = null;
    try { data = JSON.parse(txt); } catch(e){}
    if (data && data.data && data.data.timings){
      var t = {}, i, v, okAll = true;
      for (i = 0; i < PKEYS.length; i++){
        v = cleanTime(data.data.timings[PKEYS[i]]);
        if (!v) okAll = false; else t[PKEYS[i]] = v;
      }
      if (okAll){
        prayerTimings = t;
        lsSet('tvhub_prayer', JSON.stringify({ date: todayKey(), timings: t }));
        updatePrayerStrip();
      }
    }
  }, function(){ /* degrade silently: strip keeps its default line */ });
}

/* ---------------- boot ---------------- */
fit();
applyData(BAKED);          /* instant render from the baked-in registry */
showHome();
tickClock();
setInterval(tickClock, 10000);
loadPrayer();
setInterval(function(){ updatePrayerStrip(); loadPrayer(); }, 30000);
loadManifest();            /* then upgrade to the live manifest */
</script>
</body>
