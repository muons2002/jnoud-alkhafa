<style>
  :root{

    --cyan:#2FB9D8; --cyan-hi:#7fd4ea; --gold:#F5C451; --text:#eef4fb; --muted:#9db4cc; --faint:#7188a3;

  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;color:var(--text);font-family:'Segoe UI',Tahoma,Arial,sans-serif;min-height:100vh;
    background:radial-gradient(900px 480px at 85% -120px, rgba(47,185,216,.05), transparent 60%),
    radial-gradient(700px 420px at 8% 0, rgba(47,185,216,.03), transparent 55%),
    linear-gradient(160deg,#081426 0%,#0D2B45 55%,#0A3A56 100%);background-attachment:fixed;padding-bottom:40px}
  .wrap{max-width:1060px;margin:0 auto;padding:0 16px}
  header{padding:26px 0 6px;text-align:center}
  .logo-tile{width:74px;height:74px;margin:0 auto 10px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:40px;
    background:linear-gradient(145deg,#2FB9D8,#1565A8);box-shadow:0 12px 30px rgba(0,0,0,.4), inset 0 2px 0 rgba(255,255,255,.35)}
  h1{margin:0;font-size:30px;font-weight:800}
  .sub{color:var(--muted);margin-top:6px;font-size:15px}
  .count{display:inline-block;margin-top:10px;background:rgba(47,185,216,.14);border:1px solid rgba(47,185,216,.5);color:#BDEBFF;
    padding:4px 14px;border-radius:999px;font-size:13px;font-weight:700}
  .player-box{max-width:680px;margin:14px auto 0;padding:0}
  .screen{position:relative;border-radius:16px;overflow:hidden;background:#000;border:1px solid var(--line);aspect-ratio:16/9;box-shadow:0 16px 40px rgba(0,0,0,.45)}
  video{width:100%;height:100%;display:block;background:#000}
  .placeholder{position:absolute;inset:0;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;color:var(--muted);font-size:16px;text-align:center;padding:16px}
  .placeholder .big{font-size:44px}
  .nowbar{display:flex;align-items:center;gap:10px;margin-top:10px}
  .nowbar .dot{width:9px;height:9px;border-radius:50%;background:#5a6b7f;flex:0 0 auto}
  .nowbar.live .dot{background:#e5484d;box-shadow:0 0 10px #e5484d;animation:pulse 1.4s infinite}
  @keyframes pulse{50%{opacity:.45}}
  .nowname{font-weight:800;font-size:17px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stopbtn{background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:7px 16px;font-size:14px;cursor:pointer;font-family:inherit}
  .stopbtn:hover{border-color:var(--cyan)}
  .err{display:none;margin-top:8px;background:rgba(224,101,79,.12);border:1px solid rgba(224,101,79,.55);color:#ffb4a3;border-radius:10px;padding:8px 12px;font-size:14px}
  .tools{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 4px}
  .search{flex:1;min-width:180px;background:var(--card);border:1px solid var(--line-soft);color:var(--text);border-radius:12px;padding:10px 14px;font-size:15px;font-family:inherit;outline:none}
  .search:focus{border-color:var(--cyan)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 2px}
  .chip{background:var(--card);border:1px solid var(--line-soft);color:var(--muted);border-radius:999px;padding:7px 16px;font-size:14px;cursor:pointer;font-family:inherit;font-weight:700}
  .chip.on{background:linear-gradient(145deg,#2FB9D8,#1565A8);color:#fff;border-color:transparent}
  .sec-head{display:flex;align-items:center;gap:10px;margin:24px 0 12px}
  .sec-head .t{font-size:20px;font-weight:800}
  .sec-head .n{background:rgba(245,196,81,.15);border:1px solid rgba(245,196,81,.5);color:var(--gold);border-radius:999px;padding:2px 11px;font-size:12px;font-weight:800}
  .sec-head .bar{flex:1;height:1px;background:var(--line-soft)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .card{display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,var(--card),#0b2440);border:1px solid var(--line-soft);
    border-radius:var(--radius);padding:10px;cursor:pointer;text-align:right;font-family:inherit;color:var(--text);width:100%}
  .card:hover{border-color:var(--cyan)}
  .card.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold), 0 8px 22px rgba(0,0,0,.35)}
  .tile{flex:0 0 auto;width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:inset 0 2px 0 rgba(255,255,255,.3)}
  .cname{font-size:14.5px;font-weight:700;line-height:1.35}
  .csub{font-size:11.5px;color:var(--faint);margin-top:2px}
  .g1{background:linear-gradient(145deg,#e0654f,#a83226)} .g2{background:linear-gradient(145deg,#2FB9D8,#1565A8)}
  .g3{background:linear-gradient(145deg,#7fc96b,#3d7a2e)} .g4{background:linear-gradient(145deg,#b388e6,#6a3fa0)}
  .g5{background:linear-gradient(145deg,#F5C451,#c07f13)} .g6{background:linear-gradient(145deg,#f78fb3,#c2437e)}
  .g7{background:linear-gradient(145deg,#4fd8c8,#1d7a6e)} .g8{background:linear-gradient(145deg,#8fa3bf,#4a5a73)}
  footer{margin-top:34px;text-align:center;color:var(--faint);font-size:13px;line-height:1.9}
  footer a{color:var(--cyan-hi);text-decoration:none}
  .empty{display:none;text-align:center;color:var(--muted);padding:26px 0;font-size:15px}

 {n:'Fuel TV', c:'sports', e:'🛹', g:'g6', u:'https://amg01074-fueltv-fueltvemeaen-rakuten-b6j62.amagi.tv/hls/amagi_hls_data_rakutenAA-fueltvemeaen/CDN/master.m3u8'},
 {n:'Motorvision', c:'sports', e:'🏎️', g:'g8', u:'https://r.eu.cdn-redge.media/livehls/oeu/mt/live/motorvision_en/live.livx/playlist.m3u8'},
 // دينية
 {n:'اقرأ', c:'religion', e:'📖', g:'g3', u:'https://playlist.fasttvcdn.com/pl/dlkqw1ftuvuuzkcb4pxdcg/Iqraafasttv1/playlist.m3u8'},

 {n:'كوجي TV', c:'kids', e:'🧒', g:'g6', u:'https://5d658d7e9f562.streamlock.net/koogi.tv/koogi.smil/playlist.m3u8'},

 {n:'NBC News NOW', c:'world', e:'🦚', g:'g4', u:'https://d1si3n1st4nkgb.cloudfront.net/10502/88896001/hls/master.m3u8?ads.xumo_channelId=88896001'},

 {n:'Euronews', c:'world', e:'🇪🇺', g:'g7', u:'https://dash4.antik.sk/live/test_euronews/playlist.m3u8'},
 {n:'DW English', c:'world', e:'🇩🇪', g:'g8', u:'https://amg01644-amg01644c1-amgplt0343.playout.now3.amagi.tv/ts-eu-w1-n2/playlist/amg01644-amg01644c1-amgplt0343/playlist.m3u8'},

const vid = document.getElementById('vid'), ph = document.getElementById('ph'),
      nowbar = document.getElementById('nowbar'), nowname = document.getElementById('nowname'),
      errBox = document.getElementById('err'), sectionsEl = document.getElementById('sections'),
      chipsEl = document.getElementById('chips'), searchEl = document.getElementById('search'),
      emptyEl = document.getElementById('empty');
document.getElementById('count').textContent = CH.length + ' قناة مجانية';
let hls = null, activeBtn = null, filter = 'all';

function render(){
  sectionsEl.innerHTML = '';
  let visible = 0;
  const q = searchEl.value.trim();
  for (const cat of CATS){
    if (filter !== 'all' && filter !== cat.id) continue;
    const list = CH.filter(x => x.c === cat.id && (!q || x.n.includes(q)));
    if (!list.length) continue;
    visible += list.length;
    const sec = document.createElement('div');
    sec.innerHTML = '<div class="sec-head"><span class="t">' + cat.e + ' ' + cat.t + '</span><span class="n">' + list.length + '</span><span class="bar"></span></div>';
    const grid = document.createElement('div'); grid.className = 'grid';
    for (const ch of list){
      const b = document.createElement('button'); b.className = 'card'; b.type = 'button';
      b.innerHTML = '<span class="tile ' + ch.g + '">' + ch.e + '</span><span><span class="cname">' + ch.n + '</span><div class="csub">بث مباشر</div></span>';
      b.addEventListener('click', () => play(ch, b));
      grid.appendChild(b);
    }
    sec.appendChild(grid); sectionsEl.appendChild(sec);
  }
  emptyEl.style.display = visible ? 'none' : 'block';
}
function stop(){
  if (hls){ hls.destroy(); hls = null; }
  vid.pause(); vid.removeAttribute('src'); vid.load();
  ph.style.display = 'flex'; nowbar.classList.remove('live'); nowname.textContent = 'لا توجد قناة مشغلة';
  if (activeBtn){ activeBtn.classList.remove('active'); activeBtn = null; }
  errBox.style.display = 'none';
}
function showErr(msg){ errBox.textContent = msg; errBox.style.display = 'block'; }
function play(ch, btn){
  errBox.style.display = 'none';
  if (hls){ hls.destroy(); hls = null; }
  if (activeBtn) activeBtn.classList.remove('active');
  activeBtn = btn; if (btn) btn.classList.add('active');
  ph.style.display = 'none'; nowbar.classList.add('live'); nowname.textContent = ch.n;
  document.querySelector('.player-box').scrollIntoView({behavior:'smooth', block:'start'});
  const fail = () => showErr('القناة «' + ch.n + '» لا تستجيب الآن من مصدرها — جرّب قناة تانية أو عيد المحاولة بعد شوية.');
  if (window.Hls && Hls.isSupported()){
    hls = new Hls({maxBufferLength: 30});
    hls.loadSource(ch.u); hls.attachMedia(vid);
    hls.on(Hls.Events.MANIFEST_PARSED, () => { vid.play().catch(()=>{}); });
    let retries = 0;
    hls.on(Hls.Events.ERROR, (ev, data) => {
      if (!data || !data.fatal) return;
      if (data.type === Hls.ErrorTypes.NETWORK_ERROR && retries < 2){ retries++; hls.startLoad(); return; }
      if (data.type === Hls.ErrorTypes.MEDIA_ERROR && retries < 2){ retries++; hls.recoverMediaError(); return; }
      fail();
    });
  } else if (vid.canPlayType('application/vnd.apple.mpegurl')){
    vid.src = ch.u; vid.play().catch(()=>{});
    vid.onerror = fail;
  } else {
    showErr('متصفحك لا يدعم تشغيل البث المباشر هنا.');
  }
}
document.getElementById('stopbtn').addEventListener('click', stop);
const allChip = document.createElement('button');
allChip.className = 'chip on'; allChip.type = 'button'; allChip.textContent = 'الكل';
allChip.addEventListener('click', () => setFilter('all', allChip));
chipsEl.appendChild(allChip);
for (const cat of CATS){
  const c = document.createElement('button');
  c.className = 'chip'; c.type = 'button'; c.textContent = cat.e + ' ' + cat.t;
  c.addEventListener('click', () => setFilter(cat.id, c));
  chipsEl.appendChild(c);
}
function setFilter(f, el){
  filter = f;
  chipsEl.querySelectorAll('.chip').forEach(x => x.classList.remove('on'));
  el.classList.add('on'); render();
}
searchEl.addEventListener('input', render);
render();
</script>
