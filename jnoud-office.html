<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مكتب جنود الخفاء الافتراضي 🏢</title>


<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:'Segoe UI',Tahoma,Arial,sans-serif; color:#fff; min-height:100vh;
  background: linear-gradient(180deg,#081426 0%,#0D2B45 58%,#0A3A56 100%);
  padding:10px 12px 24px;
}
.wrap { max-width:880px; margin:0 auto; }
.brand { text-align:center; font-weight:700; color:#9fdcef; font-size:17px; }
h1 { font-family:'Segoe UI',Tahoma,Arial,sans-serif; text-align:center; font-size:clamp(28px,6vw,38px); font-weight:800; margin-top:2px; }
h1 .cy { color:#2FB9D8; }
.sub { text-align:center; color:#d7ecf5; font-size:clamp(15px,3.6vw,19px); margin-top:4px; }
.boss {
  margin:10px auto 0; max-width:560px; background:rgba(255,255,255,.07);
  border:2px solid rgba(232,182,76,.8); border-radius:24px; padding:11px 16px;
  display:flex; align-items:center; gap:14px; cursor:pointer; transition:transform .15s;
}
.boss:active { transform:scale(.98); }
.catcard {
  margin:8px auto 0; max-width:360px; background:rgba(255,255,255,.05);
  border:1.5px solid rgba(232,182,76,.5); border-radius:20px; padding:7px 12px;
  display:flex; align-items:center; gap:12px;
}
.catcard img.av { width:46px; height:46px; box-shadow:none; }
.catcard .nm { font-family:'Segoe UI',Tahoma,Arial,sans-serif; font-size:18px; font-weight:800; }
.catcard .rl { font-size:12.5px; color:#ffd97a; }
.catcard .btns { margin-top:6px; }
.catcard .btn { flex:none; padding:6px 16px; font-size:14px; }
img.av { border-radius:50%; object-fit:cover; flex-shrink:0; box-shadow:0 8px 20px rgba(0,0,0,.4); background:#0D2B45; }
.boss img.av { width:66px; height:66px; border:2.5px solid rgba(232,182,76,.85); }
.boss .nm { font-family:'Segoe UI',Tahoma,Arial,sans-serif; font-size:23px; font-weight:800; }
.boss .rl { font-size:14px; color:#ffd97a; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
@media (max-width:560px) {
  .desk { padding:9px 10px; }
  .desk img.av { width:46px; height:46px; }
  .desk .nm { font-size:17px; }
  .desk .rl { font-size:12px; }
  .btn { font-size:13px; padding:6px 4px; }
  .boss .nm { font-size:20px; }
  .boss img.av { width:58px; height:58px; }
  .badge { font-size:11px; padding:1px 8px; top:-9px; left:8px; }
}
.desk { background:rgba(255,255,255,.06); border:1.5px solid rgba(47,185,216,.35); border-radius:20px; padding:7px 12px; position:relative; }
.desk.center { grid-column:1 / -1; width:calc(50% - 8px); justify-self:center; }
.desk .top { display:flex; align-items:center; gap:12px; }
.desk img.av { width:48px; height:48px; }
.desk .nm { font-family:'Segoe UI',Tahoma,Arial,sans-serif; font-size:19px; font-weight:800; }
.desk .rl { font-size:13px; color:#d7ecf5; }
.badge { position:absolute; top:-10px; left:12px; background:linear-gradient(135deg,#e05260,#b03a6b); color:#fff; font-size:12.5px; font-weight:800; border-radius:999px; padding:2px 11px; box-shadow:0 6px 14px rgba(0,0,0,.35); }
.btns { display:flex; gap:8px; margin-top:5px; }
.btn { flex:1; text-align:center; border:none; cursor:pointer; font-family:'Segoe UI',Tahoma,Arial,sans-serif; font-weight:800; font-size:14.5px; border-radius:12px; padding:7px 5px; text-decoration:none; display:block; }
.btn-chat { background:linear-gradient(135deg,#14508c,#2fb9d8); color:#fff; }
.btn-proj { background:rgba(255,255,255,.1); color:#9fdcef; border:1.5px solid rgba(47,185,216,.4); }
.foot { text-align:center; color:#9fdcef; font-size:13.5px; margin-top:10px; }
.foot b { color:#ffd97a; }
/* ===== chat sheet ===== */
.sheet {
  position:fixed; bottom:14px; left:14px; z-index:50;
  width:min(420px, calc(100vw - 28px)); height:min(600px, 76vh);
  background:#0b2138; border:2.5px solid #2FB9D8; border-radius:24px;
  display:none; flex-direction:column; box-shadow:0 16px 50px rgba(0,0,0,.6);
}
.sheet.open { display:flex; }
.sheet-head { display:flex; align-items:center; gap:12px; padding:14px 16px; border-bottom:1px solid rgba(47,185,216,.25); }
.sheet-head img.av { width:54px; height:54px; box-shadow:none; }
.sheet-head .nm { font-family:'Segoe UI',Tahoma,Arial,sans-serif; font-size:21px; font-weight:800; }
.sheet-head .rl { font-size:13.5px; color:#9fdcef; }
.sheet-head .x { margin-right:auto; background:rgba(255,255,255,.1); border:none; color:#fff; width:38px; height:38px; border-radius:50%; font-size:18px; cursor:pointer; flex-shrink:0; }
.msgs { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
.msg { max-width:85%; padding:10px 14px; border-radius:16px; font-size:16px; line-height:1.65; white-space:pre-wrap; word-break:break-word; }
.msg.bot { background:rgba(47,185,216,.14); border:1px solid rgba(47,185,216,.3); align-self:flex-start; border-bottom-right-radius:4px; }
.msg.me { background:linear-gradient(135deg,#14508c,#2fb9d8); align-self:flex-end; border-bottom-left-radius:4px; }
.msg.typing { color:#9fdcef; font-style:italic; }
.chips { display:flex; gap:8px; flex-wrap:wrap; padding:0 16px 10px; }
.chip { background:rgba(255,255,255,.08); border:1.5px solid rgba(47,185,216,.45); color:#d7ecf5; border-radius:999px; padding:6px 13px; font-size:14px; font-weight:700; cursor:pointer; font-family:'Segoe UI',Tahoma,Arial,sans-serif; }
.composer { display:flex; gap:10px; padding:12px 16px 16px; border-top:1px solid rgba(47,185,216,.25); }
.composer input { flex:1; background:rgba(255,255,255,.08); border:1.5px solid rgba(47,185,216,.4); border-radius:14px; color:#fff; font-family:'Segoe UI',Tahoma,Arial,sans-serif; font-size:16px; padding:11px 14px; outline:none; }
.composer input::placeholder { color:#7fa8ba; }
.composer button { background:linear-gradient(135deg,#1e7a34,#7ac74f); border:none; color:#fff; font-family:'Segoe UI',Tahoma,Arial,sans-serif; font-weight:900; font-size:16px; border-radius:14px; padding:11px 20px; cursor:pointer; }
.composer button:disabled { opacity:.5; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🏢 مكتب جنود الخفاء <span class="cy">الافتراضي</span></h1>
  <div class="sub">فريق من الذكاء الاصطناعي بيخدمك — دوس على أي موظف وكلّمه، هيجاوبك ويدلّك على مشروعه</div>

  <div class="boss" id="bossCard">
    <img class="av" src="office-avatars/av-boss.jpg" alt="أبو محمود">
    <div>
      <div class="nm">أبو محمود</div>
      <div class="rl">المؤسس والمدير — دوس وكلّمه بنفسك</div>
    </div>
  </div>
  <div class="catcard">
    <img class="av" src="office-avatars/av-cat.jpg" alt="القط الأسود">
    <div>
      <div class="nm">القط الأسود 🐾</div>
      <div class="rl">مساعد المدير — العلامة المسجلة للجروب</div>
      <div class="btns"><button class="btn btn-chat" id="catChatBtn">💬 كلّمه</button></div>
    </div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="foot">كل مشاريعنا من مكان واحد: <b>heylink.me/InvisibleSoldiers</b> 🔗</div>
</div>

<div class="sheet" id="sheet">
  <div class="sheet-head">
    <img class="av" id="shAv" src="office-avatars/av-joly.jpg" alt="">
    <div><div class="nm" id="shNm"></div><div class="rl" id="shRl"></div></div>
    <button class="x" id="shClose">✕</button>
  </div>
  <div class="msgs" id="msgs"></div>
  <div class="chips" id="chips"></div>
  <div class="composer">
    <input id="inp" type="text" placeholder="اكتب سؤالك هنا…" maxlength="500">
    <button id="send">ابعت</button>
  </div>
</div>

<script>
var API = 'https://jnoud-office.m-uons2002.workers.dev/chat';
var AV = 'office-avatars/';
var STAFF = {
  jimmy:   { nm:'جيمي', img:'av-jimmy.jpg', rl:'جندي أول في خدمة الجروب — المشاريع والتطبيقات',
             greet:'أهلاً بيك، أنا جيمي 👋 جندي أول في خدمة الجروب، وأنا اللي بنيت المشاريع والتطبيقات هنا مع أبو محمود. اسألني عن أي تطبيق أو مشروع وهجاوبك.',
             chips:['ايه أحدث حاجة عملتوها؟','التطبيق بينزل منين؟','المشغل بيشتغل ازاي؟'],
             proj:'كل المشاريع', url:'https://heylink.me/InvisibleSoldiers' },
  joly:    { nm:'جولي', img:'av-joly.jpg', rl:'السكرتيرة — الاستقبال والصوتيات', badge:'🆕 جديدة — بالواسطة 😄',
             greet:'أهلاً أهلاً، أنا جولي 🎙️ سكرتيرة المكتب وصوت الفويس نوت بتاع الجروب. اسألني وهادلّك على اللي انت عاوزه.',
             chips:['انتي مين؟','ازاي أسمع الإذاعة؟','دخلتي الشغل ازاي؟ 😄'],
             proj:'إذاعة جنود الخفاء', url:'https://muons2002.github.io/radio-station/radio-jnoud.html' },
  emad:    { nm:'عماد أفندي', img:'av-emad.jpg', rl:'المكتبة والأرشيف — القرآن والشعراوي',
             greet:'أهلاً وسهلاً يا فندم 📚 أنا عماد أفندي، مسؤول المكتبة والأرشيف. عندنا القرآن بعشرة قرّاء ومكتبة الشيخ الشعراوي بأكتر من ألف درس. أؤمرني؟',
             chips:['الشعراوي عنده كام درس؟','أبدأ منين في المكتبة؟'],
             proj:'مكتبة الشعراوي', url:'https://muons2002.github.io/radio-station/shaarawy.html' },
  radio:   { nm:'موظف الإذاعة', img:'av-radio.jpg', rl:'الإذاعة والأغاني والتراث الصوتي',
             greet:'أهلاً بيك في قسم الإذاعة 📻 عندنا 45 محطة وأغاني الزمن الجميل وحكايات زمان. اسألني عن أي حاجة صوتية.',
             chips:['كام محطة عندكم؟','عاوز أسمع قرآن','فيه أغاني زمان؟'],
             proj:'إذاعة جنود الخفاء', url:'https://muons2002.github.io/radio-station/radio-jnoud.html' },
  sports:  { nm:'موظف الرياضة', img:'av-sports.jpg', rl:'رادار المباريات والدوري المصري',
             greet:'أهلاً يا كابتن ⚽ أنا ماسك رادار المباريات وقسم الدوري المصري. اسألني عن الرادار وهدلّك على المواعيد والنتائج والترتيب.',
             chips:['ايه اللي في رادار المباريات؟','الدوري المصري أخباره ايه؟'],
             proj:'رادار المباريات', url:'https://muons2002.github.io/radio-station/matches-radar.html' },
  services:{ nm:'موظفة الخدمات', img:'av-services.jpg', rl:'كانفا برو وأسعار الذهب والأكواد',
             greet:'أهلاً بيك في قسم الخدمات 🎨 أنا ماسكة كانفا برو وأسعار الذهب وبوابة الأكواد وبطاقة العضوية. اسألني وهاشرح لك الخطوات واحدة واحدة.',
             chips:['ازاي أطلب كانفا برو؟','الذهب بكام النهاردة؟','عاوز أكواد تطبيقات'],
             proj:'كانفا برو للأعضاء', url:'https://muons2002.github.io/radio-station/canva-pro.html' },
  ragab:   { nm:'رجب', img:'av-ragab.jpg', rl:'المشاوير والشاي — اللي مبهدلينه معانا', badge:'🏃 مشغول دايماً',
             greet:'أهلاً بيك، أنا رجب 🏃 اللي مبهدلينه معاهم هنا — مشاوير وشاي وطلبات ما بتخلصش. اسألني عن أي موظف وهاوصّلك ليه… تشرب ايه على ما توصل؟',
             chips:['انت مبهدل ليه؟ 😄','مين ماسك الإذاعة؟','عاوز شاي'],
             proj:'كل المشاريع', url:'https://heylink.me/InvisibleSoldiers' }
};
var BOSS = { nm:'أبو محمود', img:'av-boss.jpg', rl:'المؤسس والمدير',
             greet:'أهلاً بيك في مكتبنا يا غالي 🛡️ أنا أبو محمود، مؤسس جنود الخفاء. اسألني عن أي حاجة في مشاريعنا وهاوجّهك للموظف المختص.',
             chips:['ايه مشاريعكم؟','أوصل لكل حاجة منين؟','مين فريقك؟'] };
var CAT = { nm:'القط الأسود', img:'av-cat.jpg', rl:'مساعد المدير — العلامة المسجلة للجروب',
             greet:'مياو… أهلاً بيك 🐾 أنا القط الأسود، مساعد المدير والعلامة المسجلة للجروب — الناس بتعرف أبو محمود بيّا. اسألني عن أي حاجة وهادلّك على الموظف الصح.',
             chips:['انت مين؟','بتعمل ايه هنا؟','مين المدير؟'] };

var grid = document.getElementById('grid');
Object.keys(STAFF).forEach(function(key){
  var s = STAFF[key];
  var d = document.createElement('div'); d.className = 'desk';
  if (key === 'ragab') d.classList.add('center');
  d.innerHTML =
    (s.badge ? '<div class="badge">' + s.badge + '</div>' : '') +
    '<div class="top"><img class="av" src="' + AV + s.img + '" alt="' + s.nm + '">' +
    '<div><div class="nm">' + s.nm + '</div><div class="rl">' + s.rl + '</div></div></div>' +
    '<div class="btns"><button class="btn btn-chat">💬 كلّمه</button>' +
    '<a class="btn btn-proj" href="' + s.url + '" target="_blank" rel="noopener">🔗 ' + s.proj + '</a></div>';
  d.querySelector('.btn-chat').onclick = function(){ openChat(key); };
  grid.appendChild(d);
});
document.getElementById('bossCard').onclick = function(){ openChat('boss'); };
document.getElementById('catChatBtn').onclick = function(){ openChat('cat'); };

var sheet = document.getElementById('sheet'), msgs = document.getElementById('msgs'),
    chipsBox = document.getElementById('chips'), inp = document.getElementById('inp'),
    sendBtn = document.getElementById('send');
var cur = null, hist = [];

function persona(key){ return key === 'boss' ? BOSS : (key === 'cat' ? CAT : STAFF[key]); }
function addMsg(text, who){
  var m = document.createElement('div'); m.className = 'msg ' + who; m.textContent = text;
  msgs.appendChild(m); msgs.scrollTop = msgs.scrollHeight; return m;
}
function openChat(key){
  cur = key; hist = [];
  var p = persona(key);
  document.getElementById('shAv').src = AV + p.img;
  document.getElementById('shNm').textContent = p.nm;
  document.getElementById('shRl').textContent = p.rl;
  msgs.innerHTML = ''; addMsg(p.greet, 'bot');
  chipsBox.innerHTML = '';
  p.chips.forEach(function(c){
    var b = document.createElement('button'); b.className = 'chip'; b.textContent = c;
    b.onclick = function(){ inp.value = c; send(); };
    chipsBox.appendChild(b);
  });
  sheet.classList.add('open');
  setTimeout(function(){ inp.focus(); }, 250);
}
document.getElementById('shClose').onclick = function(){ sheet.classList.remove('open'); };
inp.addEventListener('keydown', function(e){ if (e.key === 'Enter') send(); });
sendBtn.onclick = send;

function send(){
  var text = inp.value.trim(); if (!text || sendBtn.disabled) return;
  inp.value = '';
  addMsg(text, 'me');
  hist.push({ role:'user', content:text });
  var t = addMsg('بيكتب…', 'bot typing');
  sendBtn.disabled = true;
  fetch(API, { method:'POST', headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ persona: cur, message: text, history: hist.slice(0, -1) })
  }).then(function(r){ return r.json(); }).then(function(d){
    t.remove();
    if (d && d.ok && d.reply) { addMsg(d.reply, 'bot'); hist.push({ role:'assistant', content:d.reply }); }
    else { addMsg('معلش، أنا مشغول دلوقتي أو لسه واصل المكتب 😅 جرب تاني كمان شوية.', 'bot'); hist.pop(); }
  }).catch(function(){
    t.remove();
    addMsg('معلش، أنا مشغول دلوقتي أو لسه واصل المكتب 😅 جرب تاني كمان شوية.', 'bot'); hist.pop();
  }).then(function(){ sendBtn.disabled = false; inp.focus(); });
}
</script>
</body>
</html>
