<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scrollbar-gutter:stable; }
  [hidden] { display:none !important; }
  body {
    font-family:'Segoe UI',Tahoma,Arial,sans-serif;
    background:linear-gradient(180deg,#081426 0%,#0D2B45 55%,#0A3A56 100%);
    color:#EAF4FA; min-height:100vh; padding:18px 14px 42px;
  }
  .wrap { max-width:560px; margin:0 auto; }
  .emblem { display:block; width:76px; height:76px; object-fit:contain; margin:4px auto 8px;
    filter:drop-shadow(0 8px 18px rgba(0,0,0,.45)); }
  h1 { text-align:center; font-size:25px; font-weight:800; line-height:1.4; }
  .brand { text-align:center; color:#F5C451; font-weight:700; margin-top:5px; font-size:15.5px; }
  .csub { text-align:center; color:#BCD9EA; margin-top:4px; font-size:14.5px; line-height:1.7; }
  .chips { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:14px; }
  .chip { background:rgba(10,32,54,.85); border:1px solid #2A5A7D; border-radius:999px;
    padding:5px 14px; font-size:13.5px; color:#BFE6F5; }
  .chip b { color:#F5C451; font-variant-numeric:tabular-nums; }
  .card {
    background:rgba(255,255,255,.06); border:1px solid rgba(245,196,81,.35);
    border-radius:16px; padding:16px; margin-top:16px;
  }
  .card h2 { font-size:18.5px; font-weight:800; text-align:center; }
  .card .mtime { text-align:center; color:#BCD9EA; font-size:13.5px; margin-top:3px; line-height:1.7; }
  label { display:block; font-weight:700; font-size:14.5px; margin:12px 0 6px; color:#D8EDF8; }
  input[type=text] {
    width:100%; padding:12px; border-radius:12px; border:1px solid rgba(255,255,255,.25);
    background:rgba(0,0,0,.25); color:#fff; font-size:16px; font-family:inherit;
  }
  .score { display:flex; align-items:center; gap:10px; justify-content:center; margin-top:6px; }
  .score .team { flex:1; text-align:center; font-weight:800; font-size:16px; }
  .score select {
    width:74px; padding:11px 6px; border-radius:12px; border:1px solid rgba(255,255,255,.25);
    background:#0D2B45; color:#fff; font-size:18px; text-align:center; font-family:inherit;
  }
  .score .x { font-size:20px; font-weight:800; color:#F5C451; }
  button {
    width:100%; margin-top:14px; padding:13px; border:none; border-radius:12px; cursor:pointer;
    background:linear-gradient(145deg,#1B9AC4,#0A5E7A); color:#fff; font-size:16.5px; font-weight:800;
    font-family:inherit;
  }
  button:disabled { opacity:.45; cursor:default; }
  .msg { text-align:center; margin-top:10px; font-size:14.5px; min-height:20px; }
  .ok { color:#7BE3A8; } .err { color:#FF9D9D; }
  .hint { text-align:center; color:#9FC3D8; font-size:13px; margin-top:8px; }
  .closedstrip {
    text-align:center; font-size:16px; font-weight:800; color:#FFD9D9;
    background:rgba(228,87,46,.16); border:1px solid rgba(228,87,46,.5);
    border-radius:12px; padding:12px; margin-top:12px;
  }
  .result {
    background:linear-gradient(145deg,#F5C451,#D9A92F); border-radius:12px; padding:12px; margin-top:12px;
    color:#081426;
  }
  .result .rlabel { text-align:center; font-size:14px; font-weight:800; }
  .rrow { display:flex; align-items:center; gap:10px; margin-top:6px; }
  .rrow .rteam { flex:1; text-align:center; font-weight:800; font-size:16.5px; }
  .rrow .rsc { direction:ltr; font-size:22px; font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .result.small { padding:9px 12px; }
  .result.small .rrow { margin-top:2px; }
  .result.small .rteam { font-size:15px; }
  .result.small .rsc { font-size:18px; }
  /* منصة التتويج */
  .podium { display:flex; align-items:flex-end; justify-content:center; gap:10px; margin:14px 0 4px; }
  .pod { text-align:center; width:100px; }
  .pod .md { font-size:19px; }
  .pod .nm { font-size:12.5px; color:#EAF4FA; margin-top:3px; line-height:1.5; word-break:break-word; }
  .pod .bar { border-radius:8px 8px 0 0; margin:6px auto 0; width:74px; }
  .pod.p1 .bar { height:52px; background:linear-gradient(180deg,#FFE9A8,#C9962E); }
  .pod.p2 .bar { height:38px; background:linear-gradient(180deg,#E8EEF4,#93A5B5); }
  .pod.p3 .bar { height:28px; background:linear-gradient(180deg,#E8A56B,#A96A35); }
  .podtitle { text-align:center; color:#F5C451; font-weight:800; font-size:15px; margin-top:12px; }
  .listhead { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .listhead b { font-size:16px; }
  .count { background:rgba(245,196,81,.16); color:#F5C451; border:1px solid rgba(245,196,81,.4);
    padding:2px 12px; border-radius:999px; font-weight:800; font-size:14px; }
  .entry {
    display:flex; justify-content:space-between; align-items:center; gap:8px;
    background:rgba(0,0,0,.22); border:1px solid rgba(255,255,255,.09);
    border-radius:11px; padding:9px 12px; margin-top:7px; font-size:15px;
  }
  .entry .sc { direction:ltr; font-weight:800; color:#F5C451; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .entry.win { border-color:#F5C451; background:rgba(245,196,81,.13); }
  .empty { text-align:center; color:#9FC3D8; padding:12px 0 4px; font-size:14.5px; line-height:1.8; }
  .sectitle { text-align:center; font-size:20px; font-weight:800; margin-top:26px; }
  .hallgrid { display:grid; grid-template-columns:1fr; gap:14px; margin-top:12px; }
  @media (min-width:520px) { .hallgrid { grid-template-columns:1fr 1fr 1fr; } }
  .hallcol { background:rgba(0,0,0,.22); border:1px solid rgba(255,255,255,.1); border-radius:12px; padding:12px; }
  .hallcol h3 { font-size:15px; text-align:center; color:#F5C451; margin-bottom:8px; }
  .hrow { display:flex; justify-content:space-between; gap:8px; font-size:13.5px; padding:5px 2px;
    border-bottom:1px solid rgba(255,255,255,.06); }
  .hrow:last-child { border-bottom:none; }
  .hrow .rk { color:#F5C451; font-weight:800; margin-inline-end:4px; }
  .hrow .ct { color:#2FB9D8; font-weight:800; white-space:nowrap; }
  .histdate { text-align:center; color:#BCD9EA; font-size:13.5px; margin-top:3px; }
  .champline { text-align:center; margin-top:8px; font-size:14.5px; color:#D8EDF8; }
  .champline b { color:#F5C451; }
  .foot { text-align:center; color:#8FB8CE; font-size:13px; margin-top:22px; }
</style>
</head>

<script>
const API = 'https://jnoud-contest.m-uons2002.workers.dev';
const $ = id => document.getElementById(id);
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function pad(n) { return String(n).padStart(2, '0'); }

let myId = localStorage.getItem('jnoud-contest-id') || localStorage.getItem('jnoud_contest_id');
if (!myId) {
  myId = 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  localStorage.setItem('jnoud-contest-id', myId);
}

let STATE = null;          // آخر /state
let lastJSON = '';         // للمقارنة قبل إعادة الرسم
let draft = {};            // اختيارات الأهداف غير المرسلة {k:{h,w}}
let phaseSig = '';         // توقيع حالة الفتح/القفل لكل ماتش

function deadlineOf(m) { return (m.kickoff || 0) - (m.closeMin || 10) * 60000; }
function matchPhase(m) {
  if (!STATE) return 'x';
  if (STATE.results && STATE.results[m.k]) return 'done';
  if (!STATE.cfg.open) return 'shut';
  if (m.kickoff && Date.now() >= deadlineOf(m)) return 'shut';
  return 'open';
}
function exactWinners(m) {
  const R = STATE.results && STATE.results[m.k];
  if (!R) return [];
  const list = (STATE.entries[m.k] || []).slice().sort((a, b) => a.ts - b.ts);
  return list.filter(e => e.h === R.h && e.w === R.w);
}

function goalOptions(sel) {
  let s = '';
  for (let i = 0; i <= 15; i++) s += '<option value="' + i + '"' + (sel === i ? ' selected' : '') + '>' + i + '</option>';
  return s;
}

function podiumHTML(m) {
  const win = exactWinners(m);
  if (!win.length) return '';
  const top = win.slice(0, 3);
  const pod = (e, cls, medal, crown) =>
    '<div class="pod ' + cls + '"><div class="md">' + medal + '</div>' +
    '<div class="nm">' + esc(e.name) + (crown ? ' 👑' : '') + '</div><div class="bar"></div></div>';
  let inner = '';
  if (top[2]) inner += pod(top[2], 'p3', '🥉', false);
  inner += pod(top[0], 'p1', '🥇', true);
  if (top[1]) inner += pod(top[1], 'p2', '🥈', false);
  return '<div class="podtitle">🏆 منصة الأبطال</div><div class="podium">' + inner + '</div>';
}

function matchHTML(m) {
  const entries = STATE.entries[m.k] || [];
  const R = STATE.results && STATE.results[m.k];
  const phase = matchPhase(m);
  let h = '<div class="card"><h2>' + esc(m.home) + ' × ' + esc(m.away) + '</h2>';
  h += '<div class="mtime">' + esc(m.when || '') +
       (m.closeMin != null ? ' — باب التوقعات يقفل قبل الماتش بـ' + m.closeMin + ' دقيقة' : '') + '</div>';

  if (R) {
    // شريط النتيجة: الرقم داخل span باتجاه LTR بقيمة «الأواي - الهوم» عشان كل رقم يقعد جنب فريقه
    h += '<div class="result"><div class="rlabel">النتيجة النهائية ⚽</div>' +
         '<div class="rrow"><span class="rteam">' + esc(m.home) + '</span>' +
         '<span class="rsc" dir="ltr">' + R.w + ' - ' + R.h + '</span>' +
         '<span class="rteam">' + esc(m.away) + '</span></div></div>';
    h += podiumHTML(m);
    if (!exactWinners(m).length)
      h += '<div class="hint">محدش أصاب نتيجة الماتش ده بالضبط المرة دي — حظ أوفر الجولة الجاية 🍀</div>';
  } else if (phase === 'open') {
    const mine = entries.find(e => e.id === myId);
    const d = draft[m.k] || (mine ? { h: mine.h, w: mine.w } : { h: 0, w: 0 });
    h += '<label>اسمك أو لقبك</label>' +
         '<input type="text" class="nm" maxlength="30" placeholder="اكتب اسمك هنا…" autocomplete="off" value="' + esc(localStorage.getItem('jnoud-contest-name') || localStorage.getItem('jnoud_contest_name') || '') + '">' +
         '<div class="score"><div class="team">' + esc(m.home) + '</div>' +
         '<select id="h-' + m.k + '" data-m="' + m.k + '" data-s="h">' + goalOptions(d.h) + '</select>' +
         '<div class="x">×</div>' +
         '<select id="w-' + m.k + '" data-m="' + m.k + '" data-s="w">' + goalOptions(d.w) + '</select>' +
         '<div class="team">' + esc(m.away) + '</div></div>' +
         '<button data-send="' + m.k + '">' + (mine ? 'عدّل توقعك ✏️' : 'سجّل توقعك ⚽') + '</button>' +
         '<div class="msg" id="msg-' + m.k + '"></div>' +
         (mine ? '<div class="hint">توقعك الحالي متسجل — تقدر تعدّله لحد ما الباب يقفل</div>' : '');
  } else {
    h += '<div class="closedstrip">🔒 التوقعات اتقفلت</div>';
  }
  h += '</div>';

  // قائمة التوقعات
  h += '<div class="card"><div class="listhead"><b>توقعات ' + esc(m.home) + ' × ' + esc(m.away) + '</b>' +
       '<span class="count">' + entries.length + ' توقع</span></div>';
  if (!entries.length) {
    h += '<div class="empty">لسه مفيش توقعات — كن أول واحد ⚽</div>';
  } else {
    h += entries.slice().reverse().map(e => {
      const win = R && e.h === R.h && e.w === R.w;
      return '<div class="entry' + (win ? ' win' : '') + '"><span>' + (win ? '🏆 ' : '') + esc(e.name) +
             '</span><span class="sc" dir="ltr">' + e.h + ' - ' + e.w + '</span></div>';
    }).join('');
  }
  h += '</div>';
  return h;
}

function hallHTML() {
  const hall = STATE.hall || {};
  const cols = [
    { key: 'players', title: '👥 أكتر ناس شاركت', field: 'p', unit: 'مشاركة' },
    { key: 'champs', title: '👑 أبطال التوقعات', field: 'champ', unit: 'بطولة' },
    { key: 'snipers', title: '🎯 ملوك الإصابة', field: 'hit', unit: 'إصابة' }
  ];
  const any = cols.some(c => (hall[c.key] || []).length);
  if (!any) return '';
  let h = '<div class="sectitle">🏅 لوحة الشرف</div><div class="card" style="margin-top:12px"><div class="hallgrid">';
  for (const c of cols) {
    h += '<div class="hallcol"><h3>' + c.title + '</h3>';
    const rows = (hall[c.key] || []).filter(p => p.name && p.name.indexOf('__') !== 0);
    if (!rows.length) h += '<div class="empty">لسه فاضية</div>';
    h += rows.map((p, i) =>
      '<div class="hrow"><span><span class="rk">' + (i + 1) + '.</span>' + esc(p.name) + '</span>' +
      '<span class="ct">' + (p[c.field] || 0) + ' ' + c.unit + '</span></div>').join('');
    h += '</div>';
  }
  return h + '</div></div>';
}

function histHTML() {
  const hist = STATE.hist || [];
  if (!hist.length) return '';
  let h = '<div class="sectitle">📜 مسابقات سابقة</div>';
  for (const item of hist) {
    let dateTxt = '';
    try {
      dateTxt = new Intl.DateTimeFormat('ar-EG', { timeZone: 'Africa/Cairo',
        weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(new Date(item.date));
    } catch (e) { /* ignore */ }
    const champsArr = Object.values(item.champs || {});
    const winnersArr = Object.values(item.winners || {});
    h += '<div class="card"><h2 style="font-size:17px">' + esc(item.title) + '</h2>' +
         '<div class="histdate">' + esc(dateTxt) + '</div>';
    (item.matches || []).forEach((mm, i) => {
      if (mm.res) {
        h += '<div class="result small"><div class="rrow"><span class="rteam">' + esc(mm.home) + '</span>' +
             '<span class="rsc" dir="ltr">' + mm.res.w + ' - ' + mm.res.h + '</span>' +
             '<span class="rteam">' + esc(mm.away) + '</span></div></div>';
      } else {
        h += '<div class="mtime" style="margin-top:8px">' + esc(mm.home) + ' × ' + esc(mm.away) + '</div>';
      }
      const champ = champsArr[i];
      const nw = (winnersArr[i] || []).length;
      h += '<div class="champline">' + (champ
        ? '👑 بطل التوقعات: <b>' + esc(champ) + '</b>' + (nw > 1 ? ' — و' + nw + ' فائز أصابوا بالضبط 🏆' : '')
        : 'محدش أصاب النتيجة دي بالضبط') + '</div>';
    });
    h += '</div>';
  }
  return h;
}

function renderAll() {
  const cfg = STATE.cfg;
  $('title').textContent = cfg && cfg.title ? cfg.title : 'مسابقة التوقعات';
  document.title = (cfg && cfg.title ? cfg.title : 'مسابقة التوقعات') + ' | جنود الخفاء';
  $('csub').textContent = cfg && cfg.sub ? cfg.sub : '';

  if (!cfg) {
    $('chips').hidden = true;
    $('matches').innerHTML = '<div class="card"><div class="empty" style="font-size:16.5px">🎯 مفيش مسابقة شغالة دلوقتي<br>ترقبوا المسابقة الجاية قريب إن شاء الله</div></div>';
  } else {
    // عدّاد المشاركين الفريدين عبر كل الماتشات
    const ids = new Set();
    for (const m of cfg.matches) for (const e of (STATE.entries[m.k] || [])) ids.add(e.id || e.name);
    $('pcount').textContent = ids.size;
    $('chips').hidden = false;
    $('matches').innerHTML = cfg.matches.map(matchHTML).join('');
    bindMatchControls();
  }
  $('hall').innerHTML = hallHTML();
  $('hist').innerHTML = histHTML();
  phaseSig = phaseSignature();
  tick();
}

function phaseSignature() {
  if (!STATE || !STATE.cfg) return 'nocfg';
  return STATE.cfg.matches.map(m => m.k + ':' + matchPhase(m)).join('|');
}

function bindMatchControls() {
  document.querySelectorAll('.nm').forEach(inp => {
    inp.addEventListener('input', () => {
      const v = inp.value;
      localStorage.setItem('jnoud-contest-name', v.trim());
      document.querySelectorAll('.nm').forEach(o => { if (o !== inp) o.value = v; });
    });
  });
  document.querySelectorAll('select[data-m]').forEach(sel => {
    sel.addEventListener('change', () => {
      const k = sel.getAttribute('data-m');
      draft[k] = draft[k] || { h: 0, w: 0 };
      draft[k][sel.getAttribute('data-s')] = parseInt(sel.value, 10);
    });
  });
  document.querySelectorAll('button[data-send]').forEach(btn => {
    btn.addEventListener('click', () => submit(btn.getAttribute('data-send')));
  });
}

async function submit(k) {
  const name = (localStorage.getItem('jnoud-contest-name') || localStorage.getItem('jnoud_contest_name') || '').trim() ||
               (document.querySelector('.nm') ? document.querySelector('.nm').value.trim() : '');
  const msg = $('msg-' + k);
  if (!name) {
    if (msg) { msg.className = 'msg err'; msg.textContent = 'اكتب اسمك الأول يا بطل'; }
    const inp = document.querySelector('.nm');
    if (inp) inp.focus();
    return;
  }
  localStorage.setItem('jnoud-contest-name', name);
  const hSel = $('h-' + k), wSel = $('w-' + k);
  const btn = document.querySelector('button[data-send="' + k + '"]');
  if (btn) btn.disabled = true;
  if (msg) { msg.className = 'msg'; msg.textContent = 'جارٍ التسجيل…'; }
  try {
    const r = await fetch(API + '/enter', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ m: k, id: myId, name: name,
        h: parseInt(hSel.value, 10), w: parseInt(wSel.value, 10) })
    });
    const j = await r.json().catch(() => ({}));
    if (j.ok) {
      delete draft[k];
      if (msg) { msg.className = 'msg ok'; msg.textContent = 'اتسجل توقعك يا بطل ✅ بالتوفيق'; }
      lastJSON = ''; // إجبار إعادة الرسم بعد التحديث
      await load();
    } else if (j.error === 'closed') {
      if (msg) { msg.className = 'msg err'; msg.textContent = 'باب التوقعات قفل خلاص 🔒'; }
      lastJSON = ''; await load();
    } else {
      if (msg) { msg.className = 'msg err'; msg.textContent = 'حصلت مشكلة — حاول تاني'; }
    }
  } catch (e) {
    if (msg) { msg.className = 'msg err'; msg.textContent = 'مشكلة في الاتصال — حاول تاني'; }
  }
  if (btn) btn.disabled = false;
}

async function load() {
  try {
    const r = await fetch(API + '/state', { cache: 'no-store' });
    const j = await r.json();
    const s = JSON.stringify(j);
    if (s !== lastJSON) {
      lastJSON = s;
      STATE = j;
      renderAll();
    }
  } catch (e) { /* keep last render */ }
}

function tick() {
  if (!STATE || !STATE.cfg) return;
  // عدّاد أقرب قفل قادم
  const now = Date.now();
  let best = null;
  for (const m of STATE.cfg.matches) {
    if (STATE.results && STATE.results[m.k]) continue;
    const d = deadlineOf(m);
    if (d > now && (best === null || d < best)) best = d;
  }
  if (best === null) {
    $('cdval').textContent = STATE.cfg.scored ? 'انتهت المسابقة 🏁' : 'الباب قفل 🔒';
  } else {
    const s = Math.floor((best - now) / 1000);
    $('cdval').textContent = 'يقفل بعد ' + pad(Math.floor(s / 3600)) + ':' + pad(Math.floor(s % 3600 / 60)) + ':' + pad(s % 60);
  }
  // لو حالة أي ماتش اتقلبت (قفل/نتيجة) نعيد رسم الماتشات
  if (phaseSignature() !== phaseSig) renderAll();
}

load();
setInterval(() => { if (!document.hidden) load(); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
setInterval(tick, 1000);
</script>
</body>
</html>
